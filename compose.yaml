services:
  piresearch:
    image: ${PIRESEARCH_IMAGE:-ghcr.io/lrm-lab/piresearch:latest}
    container_name: piresearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNS_DIR: /data/runs
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ./runs:/data/runs

  caddy:
    image: caddy:2.11.3
    container_name: piresearch-caddy
    restart: unless-stopped
    depends_on:
      - piresearch
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
