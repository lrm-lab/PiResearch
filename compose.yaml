services:
  piresearch:
    image: ${PIRESEARCH_IMAGE:-ghcr.io/lrm-lab/piresearch:latest}
    container_name: piresearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNS_DIR: /data/runs
    volumes:
      - ./runs:/data/runs
    networks:
      - coforge-staging-apps

  # CoForge App: Agent manifest and /api/coforge/*, in front of PiResearch's own API. Answers 404
  # everywhere while COFORGE_ISSUER is unset in .env.
  coforge-app:
    image: ${COFORGE_APP_IMAGE:-ghcr.io/lrm-lab/piresearch-coforge-app:latest}
    container_name: piresearch-coforge-app
    restart: unless-stopped
    depends_on:
      - piresearch
    environment:
      COFORGE_ISSUER: ${COFORGE_ISSUER:-}
      COFORGE_CLIENT_ID: ${COFORGE_CLIENT_ID:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      COFORGE_MAX_CONCURRENT_RUNS: ${COFORGE_MAX_CONCURRENT_RUNS:-2}
      PIRESEARCH_INTERNAL_URL: http://piresearch:8766
    volumes:
      - coforge-app-data:/data
    networks:
      - coforge-staging-apps

volumes:
  coforge-app-data:

# The host is CoForge's staging machine (lrm-lab/coforge infra/staging). Its Caddy owns 80/443 and
# serves research.coforge.cn, reaching these two containers by name on this shared network.
networks:
  coforge-staging-apps:
    external: true
