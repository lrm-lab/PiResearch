name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-s89
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Prepare remote directory
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new "$REMOTE" \
            "mkdir -p /home/dev/piresearch/runs /home/dev/piresearch/caddy-data /home/dev/piresearch/caddy-config"
      - name: Upload compose file and Caddyfile
        run: |
          scp -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new compose.yaml Caddyfile \
            "$REMOTE:/home/dev/piresearch/"
      - name: Log in to GHCR on the host
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new "$REMOTE" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin" <<< "$GHCR_TOKEN"
      - name: Pull image and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new "$REMOTE" \
            "cd /home/dev/piresearch && \
             PIRESEARCH_IMAGE='$IMAGE' docker compose pull && \
             PIRESEARCH_IMAGE='$IMAGE' docker compose up -d && \
             docker logout ghcr.io"
