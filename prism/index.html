<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>PiResearch Prism</title>
    <script>
      // Apply the theme before first paint so an embedded page never flashes the wrong one.
      // Same rules as src/lib/theme.ts: ?theme= wins, then the stored host choice, then the system.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q === "light" || q === "dark" ? q : sessionStorage.getItem("prism-theme");
          if (q === "light" || q === "dark") sessionStorage.setItem("prism-theme", q);
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark-mode");
        } catch (e) {}
      })();
    </script>
