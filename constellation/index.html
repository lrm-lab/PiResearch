function selectionHeading(text, goal){
  const full = String(text || "").trim();
  if(!goal) return full;
  const clean = full.replace(/^#\s*Task\s*/i, "").replace(/^#+\s*/, "").trim();
  const sentence = clean.split(/[。！？\n]|[.!?](?=\s|$)/)[0].trim() || clean;
  const chars = Array.from(sentence);
  return chars.length > 100 ? chars.slice(0,100).join("") + "…" : sentence;
}

function renderSelectionHeading(node, step){
  const full = String(step ? (step.label || step.tool) : (node.title || ""));
  const goal = Boolean(node.goal && !step);
  document.querySelector("#title").textContent = selectionHeading(full,goal);
  const details = document.querySelector("#question-details");
  const content = document.querySelector("#question-content");
  const owner = JSON.stringify([node.id,activeStep]);
  if(details.dataset.owner !== owner){
    details.open = false;
    content.scrollTop = 0;
    document.querySelector(".drawer-body").scrollTop = 0;
    details.dataset.owner = owner;
  }
  details.hidden = !(goal || full.length > 90 || /\n/.test(full));
  document.querySelector("#question-label").textContent = goal ? "完整问题" : "完整内容";
  document.querySelector("#question-length").textContent = `${Array.from(full).length.toLocaleString()} 字符`;
  content.setAttribute("aria-label", goal ? "完整问题内容" : "完整节点内容");
  // Keep the same text node across polling updates so reading position and
  // text selection survive graph/status refreshes.
  if(content.textContent !== full) content.textContent = full;
}

async function loadNodeDetails(id){
  const node = nodeById(id);
  if(!node || node.goal || node.steps_loaded !== false || !node.step_count) return;
  const key = `${id}:${node.steps_revision}`;
  if(detailRequests.has(key)) return detailRequests.get(key);
  const request = (async () => {
    try{
      const response = await fetch(endpoint("node") + "?id=" + encodeURIComponent(id),{signal:AbortSignal.timeout(15000)});
      if(!response.ok) throw new Error("node details unavailable");
      const detail = await response.json();
      const current = nodeById(id);
      if(!current) return;
      if(current.steps_revision !== detail.steps_revision){
        responseTags.delete(endpoint("snapshot"));
        void refresh();
        return;
      }
      nodeDetails.set(id,{revision:detail.steps_revision,steps:detail.steps || []});
      current.steps = detail.steps || [];
      current.steps_loaded = true;
      if(selected === id) select(id);
    }catch(error){
      if(selected !== id) return;
      const host = document.querySelector("#steps");
      host.textContent = "";
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "detail-retry";
      retry.textContent = "工具详情暂未读出，点击重试";
      retry.addEventListener("click", () => loadNodeDetails(id));
      host.appendChild(retry);
    }
  })();
  detailRequests.set(key,request);
  try{await request;}finally{detailRequests.delete(key);}
}

function select(id, stepIndex){
  if(selected !== id) activeStep = null;
  selectionTransition = selected !== id;
  selected = id;
  if(arguments.length > 1) activeStep = stepIndex;
  const node = nodeById(id);
  if(!node){
    clearSelection();
    return;
  }
  const step = activeStep != null && node.steps ? node.steps[activeStep] : null;
  const goal = Boolean(node.goal);
  document.querySelector("#back-goal").hidden = goal;
  document.querySelector("#kind").hidden = !step;
  document.querySelector("#agents").hidden = true;
  document.querySelector("#status-section").hidden = goal;
  document.querySelector("#notes-section").hidden = goal;
  document.querySelector("#steps-section").hidden = goal;
  document.querySelector("#kind").textContent = step ? (TOOL[step.tool] || "步骤") : "";
  document.querySelector("#kind").style.color = step ? (TITLE_COLOR[step.tool] || "#e5e5e5") : "";
  renderSelectionHeading(node,step);
  document.querySelector("#agents").textContent = "";
  document.querySelector("#status").textContent = goal ? "" : (STATUS[node.status] || node.status || "—");
  document.querySelector("#notes").textContent = node.notes || (goal ? "" : "还没有备注");
  renderChildren(node);
  const steps = document.querySelector("#steps");
  steps.innerHTML = "";
  if(node.steps_loaded === false && node.step_count > 0){
    steps.textContent = "正在读取工具步骤…";
    void loadNodeDetails(id);
  } else if(!node.steps || !node.steps.length) steps.textContent = "没有工具步骤";
  else node.steps.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = `step${activeStep === index ? " on" : ""}`;
    const who = document.createElement("small");
    who.style.color = TITLE_COLOR[item.tool] || "#e5e5e5";
    who.textContent = `${TOOL[item.tool] || "步骤"}${item.count > 1 ? " ×" + item.count : ""}${item.error ? " · 失败" : ""}`;
    row.appendChild(who);
    if(item.label){
      const summary = document.createElement("b");
      summary.textContent = item.label;
      row.appendChild(summary);
    }
    row.appendChild(document.createTextNode(item.detail || ""));
    row.addEventListener("click", () => select(id, index));
    steps.appendChild(row);
  });
  draw();
  const current = document.querySelector("#steps .step.on");
  if(current) current.scrollIntoView({block: "nearest"});
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}

function labelBefore(gap){
  const pipe = gap.lastIndexOf("|");
  if(pipe >= 0){
    const picked = labelInside(gap.slice(pipe + 1));
    return {keep: gap.slice(0, pipe + 1) + picked.keep, text: picked.text};
  }
  return labelInside(gap);
}

function labelInside(gap){
  if(/来源\s*[:：]\s*$/.test(gap)) return {keep: gap.replace(/来源\s*[:：]\s*$/, ""), text: "来源"};
  if(/\s*[—–]\s*$/.test(gap) || /\s+-\s+$/.test(gap)){
    const nl = gap.lastIndexOf("\n");
    const line = nl >= 0 ? gap.slice(nl + 1) : gap;
    const head = nl >= 0 ? gap.slice(0, nl + 1) : "";
    const num = line.match(/^\s*\d+\.\s+/);
    const body = line.replace(/^\s*\d+\.\s+/, "").replace(/\s*[—–-]\s*$/, "").trim();
    if(body && body.length <= 120) return {keep: head + (num ? num[0] : ""), text: body};
  }
  const delim = /[；;。！？\n：:（(，,、]/g;
  let cut = 0;
  let found;
  while((found = delim.exec(gap))) cut = found.index + found[0].length;
  const tail = gap.slice(cut).trim();
  if(tail && tail.length <= 80) return {keep: gap.slice(0, cut), text: tail};
  return {keep: gap.replace(/[ \t]*$/, ""), text: "来源"};
}

// URLs inside code (fenced blocks and `spans`) are literal text, so fold only the prose between them.
function foldUrls(source){
  const code = /```[\s\S]*?```|`[^`\n]+`/g;
  let out = "";
  let cursor = 0;
  let match;
  while((match = code.exec(source))){
    out += foldProseUrls(source.slice(cursor, match.index)) + match[0];
    cursor = match.index + match[0].length;
  }
  return out + foldProseUrls(source.slice(cursor));
}

function foldProseUrls(source){
  const found = [];
  const re = /https?:\/\/[^\s<）)，。；、]+/g;
  let match;
  while((match = re.exec(source))){
    if(match.index >= 2 && source[match.index - 2] === "]" && source[match.index - 1] === "(") continue;
    const href = match[0].replace(/[.,;:]+$/, "");
    found.push({start: match.index, end: match.index + match[0].length, href, trailing: match[0].slice(href.length)});
  }
  if(!found.length) return source;
  let out = "";
  let cursor = 0;
  for(const item of found){
    const picked = labelBefore(source.slice(cursor, item.start));
    const href = item.href.replace(/\(/g, "%28").replace(/\)/g, "%29");
    let text = picked.text.replace(/[\[\]*]/g, "").replace(/\|/g, "").trim();
    if(!text || text === "来源" || /^https?:\/\//i.test(text)) text = linkHost(href) || "原文";
    out += picked.keep + "[" + text + "](" + href + ")" + item.trailing;
    cursor = item.end;
  }
  return out + source.slice(cursor);
}

function linkHost(href){
  try { return new URL(href).host.replace(/^www\./, ""); }
  catch(error){ return ""; }
}

// The ** that closes a bold run starting at `from`, skipping any inside `code`.
function closingBold(text, from){
  let i = from;
  while(i < text.length){
    if(text[i] === "`"){
      const end = text.indexOf("`", i + 1);
      if(end > i + 1){ i = end + 1; continue; }
    }
    if(text.startsWith("**", i)) return i;
    i += 1;
  }
  return -1;
}

function inlineMarkdown(source){
  const text = String(source);
  let html = "";
  let i = 0;
  while(i < text.length){
    if(text[i] === "`"){
      const end = text.indexOf("`", i + 1);
      if(end > i + 1){
        html += "<code>" + escapeHtml(text.slice(i + 1, end)) + "</code>";
        i = end + 1;
        continue;
      }
    }
    if(text.startsWith("**", i)){
      const end = closingBold(text, i + 2);
      if(end !== -1){
        html += "<strong>" + inlineMarkdown(text.slice(i + 2, end)) + "</strong>";
        i = end + 2;
        continue;
      }
    }
    const link = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/.exec(text.slice(i));
    if(link){
      const host = linkHost(link[2]);
      html += '<a href="' + escapeHtml(link[2]) + '" target="_blank" rel="noopener noreferrer"' + (host ? ' title="' + escapeHtml(host) + '"' : "") + ">" + inlineMarkdown(link[1]) + "</a>";
      i += link[0].length;
      continue;
    }
    const url = /^https?:\/\/[^\s<）)，。；、]+/.exec(text.slice(i));
    if(url){
      const href = url[0].replace(/[.,;:]+$/, "");
      html += '<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(href) + "</a>" + escapeHtml(url[0].slice(href.length));
      i += url[0].length;
      continue;
    }
    html += escapeHtml(text[i]);
    i += 1;
  }
  return html;
}

function joinParagraph(parts){
  return parts.reduce((acc, part) => {
    if(!acc) return part;
    const cjk = /[\u3400-\u9fff]$/.test(acc) && /^[\u3400-\u9fff]/.test(part);
    return acc + (cjk ? "" : " ") + part;
  }, "");
}

function splitCells(line){
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
}

function isTableRule(line){
  return /^\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)+\|?$/.test(line.trim());
}

function tableAlign(cell){
  const text = cell.trim();
  if(text.startsWith(":") && text.endsWith(":")) return "center";
  if(text.endsWith(":")) return "right";
  return "";
}

function chapterTitle(body){
  if(/Completeness Check|Correctness Check|Deliverable Check/.test(body)) return "证据核对";
  const scope = /^Scope:\s*([^\n]+)/m.exec(body);
  if(scope){
    let title = scope[1].split(/[。.]/)[0];
    title = title.replace(/^研究\s*/, "").replace(/，采用[\s\S]*$/, "").replace(/，方法[\s\S]*$/, "").replace(/。$/, "").trim();
    const lead = title.split(/[：:]/)[0].trim();
    if(lead.length >= 6 && lead.length <= 28) return lead;
    if(title.length >= 6 && title.length <= 28) return title;
  }
  const head = /^\*\*\d+\.\s+([^*\n]+)\*\*\s*$/m.exec(body) || /^【\d+\.\s+([^】\n]+)】\s*$/m.exec(body);
  if(head) return head[1].replace(/（RETRIEVED[^）]*）/g, "").trim();
  const plain = /^\d+\.\s+([^：:—\n]{2,22})/m.exec(body);
  if(plain) return plain[1].trim();
  return "研究发现";
}

function scopeLede(body){
  const found = /^Scope:\s*([^\n]+)/m.exec(body);
  if(!found) return "";
  let text = found[1].split(/。/)[0];
  text = text.replace(/采用[\s\S]*$/, "").replace(/方法[:：][\s\S]*$/, "").replace(/产出[\s\S]*$/, "").trim();
  if(!text || text.length > 90) return "";
  return text.endsWith("。") ? text : text + "。";
}

function cleanEvidenceLine(line){
  const trimmed = line.trim();
  if(/\/Users\/|sandbox\/worktree|产出文件/.test(trimmed)) return null;
  const evidence = /^-\s+(https?:\/\/\S+(?:\s*(?:与|and)\s*https?:\/\/\S+)*)\s*[—–-]\s*(.+)$/.exec(trimmed);
  if(!evidence) return line;
  const desc = evidence[2].replace(/\s*quality:\s*\S+(?:\s*[（(][^）)]*[）)])?/i, "").replace(/[\[\]]/g, "").trim() || "来源";
  const urls = evidence[1].match(/https?:\/\/\S+/g).map(href => href.replace(/[，,;；。]+$/, ""));
  return urls.map(href => "- [" + desc + "](" + href + ")").join("\n");
}

function cleanChapter(body){
  let text = String(body || "").replace(/\r\n/g, "\n").trim();
  if(!text || (/^\[NOTE:/.test(text) && text.length < 900)) return "";
  text = text.replace(/\[NOTE:[^\]]*\]\s*/g, "");
  text = text.replace(/\s*quality:\s*[A-Za-z/]+(?:\s*[（(][^）)\n]*[）)])?/gi, "");
  const title = chapterTitle(text);
  const lede = scopeLede(text);
  text = text.replace(/^Scope:\s*[^\n]*\n*/m, "");
  text = text.replace(/^Findings:\s*\n*/m, "");
  text = text.replace(/（RETRIEVED[^）]*）/g, "");
  text = text.replace(/^\*\*(\d+\.\s*[^*]+)\*\*\s*$/gm, "### $1");
  text = text.replace(/^【(\d+\.\s*[^】]+)】\s*$/gm, "### $1");
  text = text.replace(/^Evidence:\s*$/m, "### 来源");
  text = text.replace(/^Confidence:\s*/m, "> **判断** ");
  text = text.replace(/^Unresolved:\s*$/m, "### 尚未确认");
  text = text.replace(/^Disconfirming:\s*/m, "> **相反证据** ");
  text = text.replace(/^Conflicts:\s*/m, "> **分歧** ");
  text = text.replace(/^##\s+Completeness Check\s*$/m, "### 完整性");
  text = text.replace(/^##\s+Correctness Check\s*$/m, "### 正确性");
  text = text.replace(/^##\s+Precision Issues\s*$/m, "### 精度");
  text = text.replace(/^##\s+Discipline Issues[^\n]*$/m, "### 写法");
  text = text.replace(/^##\s+Deliverable Check\s*$/m, "### 交付");
  if(title && title !== "研究发现"){
    const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    text = text.replace(new RegExp("^###\\s+(?:\\d+\\.\\s+)?" + escaped + "\\s*$", "m"), "");
  }
  const lines = text.split("\n").map(cleanEvidenceLine).filter(line => line !== null);
  text = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  if(!text) return "";
  return "## " + title + "\n\n" + (lede ? lede + "\n\n" : "") + text;
}

function prepareUserReport(source, title){
  const raw = String(source || "").replace(/\r\n/g, "\n");
  const chapters = [];
  const reports = /<report\b([^>]*)>([\s\S]*?)<\/report>/gi;
  let match;
  while((match = reports.exec(raw))){
    const status = (/\bstatus="([^"]*)"/.exec(match[1] || "") || [])[1] || "";
    if(status === "incomplete") continue;
    const chapter = cleanChapter(match[2]);
    if(chapter) chapters.push(chapter);
  }
  let body = chapters.length ? chapters.join("\n\n") : raw.replace(/^##\s+Best-effort collected results[\s\S]*?(?=\n#|\n<report|$)/, "").trim();
  if(chapters.length) body = body.replace(/^#\s+/gm, "## ");
  const heading = String(title || "").trim();
  const usable = heading && heading !== "正在读取" && heading !== "这份运行没有星图";
  if(chapters.length && usable) body = "# " + heading + "\n\n" + body;
  return body;
}

function leadBold(item){
  if(/^\*\*/.test(item) || /^\[/.test(item)) return item;
  const labeled = /^(.{2,18}?)([：:])/.exec(item);
  if(labeled && !/https?:/.test(labeled[1])) return "**" + labeled[1] + "**" + labeled[2] + item.slice(labeled[0].length);
  const cjk = /^([\u3400-\u9fff]{2,4})/.exec(item);
  if(cjk && item.length > cjk[1].length + 8) return "**" + cjk[1] + "**" + item.slice(cjk[1].length);
  return item;
}

function splitLongItem(item){
  const marks = item.split("；").length - 1;
  if(item.length < 220 || marks < 2) return [item];
  return item.split("；").map(part => part.trim()).filter(Boolean);
}

function plainLength(cell){
  return String(cell || "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[*`]/g, "").trim().length;
}

function columnKind(header, samples){
  const name = String(header || "").replace(/\*/g, "").replace(/\s+/g, "");
  const longest = Math.max(name.length, ...samples.map(plainLength));
  if(/来源|出处|链接|参考/.test(name)) return "source";
  if(/^(日期|时间)$/.test(name)) return longest <= 28 ? "date" : "text";
  const dated = samples.filter(cell => /^\d{4}-\d{2}-\d{2}$/.test(String(cell || "").trim())).length;
  if(name.length <= 4 && longest <= 28 && dated >= Math.max(1, samples.filter(Boolean).length * 0.6)) return "date";
  if(longest > 0 && longest <= 8) return "label";
  return "text";
}

function cellNumeric(cell){
  const text = String(cell || "").replace(/\*\*/g, "").trim();
  if(!text || text.length > 28) return false;
  const digits = (text.match(/\d/g) || []).length;
  return digits > 0 && !/[\u3400-\u9fff]{3,}/.test(text) && !/[A-Za-z]{5,}/.test(text);
}

function tableWidthPlan(headers,rows,kinds){
  const measure = cell => {
    const text = String(cell || "").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*`]/g,"");
    return [...text].reduce((width,char) => width + (char === " " ? 3.5 : char.codePointAt(0) > 255 ? 14 : 7),0);
  };
  const profiles = headers.map((header,index) => {
    const longest = Math.max(measure(header),...rows.map(row => measure(row[index])));
    const clamp = (min,value,max) => Math.max(min,Math.min(max,Math.ceil(value)));
    switch(kinds[index]){
      case "source": return {minimum:160,weight:clamp(160,longest * .6 + 28,232)};
      case "date": return {minimum:136,weight:clamp(136,longest * .65 + 28,208)};
      case "num": {
        const width = clamp(104,longest + 28,224);
        return {minimum:width,weight:width};
      }
      case "label": return {minimum:104,weight:clamp(104,longest + 28,168)};
      default: return {minimum:180,weight:clamp(180,longest * .55 + 28,360)};
    }
  });
  const total = profiles.reduce((sum,column) => sum + column.weight,0);
  let assigned = 0;
  const columns = profiles.map((column,index) => {
    const percentage = index === profiles.length - 1 ? Number((100 - assigned).toFixed(3)) : Number((column.weight / total * 100).toFixed(3));
    assigned += percentage;
    return percentage;
  });
  // With a fixed table layout, this floor keeps every column at or above its
  // readable minimum. Narrow containers scroll instead of shrinking the cells.
  const minimum = Math.ceil(Math.max(...profiles.map((column,index) => column.minimum * 100 / columns[index])));
  return {minimum,columns};
}

function renderMarkdown(source){
  source = foldUrls(source);
  const lines = String(source).replace(/\r\n/g, "\n").split("\n");
  const blocks = [];
  let i = 0;
  while(i < lines.length){
    const trimmed = lines[i].trim();
    if(!trimmed){ i += 1; continue; }
    const heading = /^(#{1,6})\s+(.+)$/.exec(trimmed);
    if(heading){
      const level = heading[1].length;
      blocks.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
      i += 1;
      continue;
    }
    if(/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)){
      blocks.push("<hr>");
      i += 1;
      continue;
    }
    if(trimmed.startsWith("```")){
      const code = [];
      i += 1;
      while(i < lines.length && !lines[i].trim().startsWith("```")){
        code.push(lines[i]);
        i += 1;
      }
      if(i < lines.length) i += 1;
      blocks.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
      continue;
    }
    if(trimmed.startsWith(">")){
      const paragraphs = [];
      let current = [];
      while(i < lines.length && lines[i].trim().startsWith(">")){
        const content = lines[i].trim().replace(/^>\s?/, "");
        if(!content){
          if(current.length) paragraphs.push(joinParagraph(current));
          current = [];
        } else current.push(content);
        i += 1;
      }
      if(current.length) paragraphs.push(joinParagraph(current));
      blocks.push("<blockquote>" + paragraphs.map(part => "<p>" + inlineMarkdown(part) + "</p>").join("") + "</blockquote>");
      continue;
    }
    if(trimmed.startsWith("|") && i + 1 < lines.length && isTableRule(lines[i + 1])){
      const head = splitCells(trimmed);
      const align = splitCells(lines[i + 1]).map(tableAlign);
      i += 2;
      const rows = [];
      while(i < lines.length && lines[i].trim().startsWith("|")){
        const cells = splitCells(lines[i]);
        rows.push(head.map((_,index) => index === head.length - 1 ? cells.slice(index).join(" | ") : (cells[index] || "")));
        i += 1;
      }
      const kinds = head.map((header, index) => columnKind(header, rows.map(row => row[index] || "")));
      const numeric = head.map((_, index) => {
        if(["date","source"].includes(kinds[index]) || /^(日期|时间)$/.test(head[index].replace(/[*\s]/g,""))) return false;
        const samples = rows.map(row => row[index] || "").filter(Boolean);
        if(!samples.length) return false;
        const hits = samples.filter(cellNumeric).length;
        return hits / samples.length >= 0.6;
      });
      const columnTypes = kinds.map((kind,index) => numeric[index] ? "num" : kind);
      const layout = tableWidthPlan(head,rows,columnTypes);
      const aligned = (tag, cell, index) => {
        const kind = columnTypes[index] || "text";
        const alignment = align[index] || (numeric[index] ? "right" : "");
        const style = alignment ? ' style="text-align:' + alignment + '"' : "";
        return "<" + tag + ' class="' + kind + '"' + style + ">" + inlineMarkdown(cell) + "</" + tag + ">";
      };
      const th = head.map((cell, index) => aligned("th", cell, index)).join("");
      const body = rows.map(row => "<tr>" + row.map((cell, index) => aligned("td", cell, index)).join("") + "</tr>").join("");
      const columns = layout.columns.map(width => '<col style="width:' + width + '%">').join("");
      const name = escapeHtml("表格：" + head.map(cell => cell.replace(/\*\*|`/g, "")).join("、"));
      blocks.push('<div class="table-wrap" role="region" aria-label="' + name + '" tabindex="0"><table style="min-width:' + layout.minimum + 'px"><colgroup>' + columns + '</colgroup><thead><tr>' + th + "</tr></thead><tbody>" + body + "</tbody></table></div>");
      continue;
    }
    if(/^[-*]\s+/.test(trimmed)){
      const items = [];
      while(i < lines.length && /^[-*]\s+/.test(lines[i].trim())){
        const raw = lines[i].trim().replace(/^[-*]\s+/, "");
        splitLongItem(raw).forEach(part => {
          const only = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/.exec(part.trim());
          if(only){
            const host = linkHost(only[2]);
            items.push('<li class="source"><a class="bookmark" href="' + escapeHtml(only[2]) + '" target="_blank" rel="noopener noreferrer"><b>' + inlineMarkdown(only[1]) + "</b>" + (host ? "<small>" + escapeHtml(host) + "</small>" : "") + "</a></li>");
            return;
          }
          items.push("<li>" + inlineMarkdown(leadBold(part)) + "</li>");
        });
        i += 1;
      }
      blocks.push("<ul>" + items.join("") + "</ul>");
      continue;
    }
    if(/^\d+\.\s+/.test(trimmed)){
      const items = [];
      while(i < lines.length && /^\d+\.\s+/.test(lines[i].trim())){
        items.push("<li>" + inlineMarkdown(lines[i].trim().replace(/^\d+\.\s+/, "")) + "</li>");
        i += 1;
      }
      blocks.push("<ol>" + items.join("") + "</ol>");
      continue;
    }
    const para = [trimmed];
    i += 1;
    while(i < lines.length){
      const next = lines[i].trim();
      if(!next || /^(#{1,6})\s+/.test(next) || /^(---|```)/.test(next) || next.startsWith(">") || next.startsWith("|") || /^[-*]\s+/.test(next) || /^\d+\.\s+/.test(next)) break;
      para.push(next);
      i += 1;
    }
    blocks.push("<p>" + inlineMarkdown(joinParagraph(para)) + "</p>");
  }
  return blocks.join("");
}

function articleHtml(article){
  const clone = article.cloneNode(true);
  if(clone.firstElementChild && clone.firstElementChild.tagName === "H1") clone.firstElementChild.remove();
  clone.querySelectorAll("svg,button,[aria-hidden='true'],script,style").forEach(el => el.remove());
  clone.querySelectorAll("*").forEach(el => {
    for(const name of ["id","class","tabindex","role","aria-label","aria-current"]) el.removeAttribute(name);
    if(el.tagName !== "TH" && el.tagName !== "TD") el.removeAttribute("style");
  });
  clone.querySelectorAll("div").forEach(wrap => {
    if(wrap.children.length === 1 && wrap.firstElementChild.tagName === "TABLE") wrap.replaceWith(wrap.firstElementChild);
  });
  return clone.innerHTML;
}

function saveText(filename, text, mime){

  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.rel = "noopener";

function printDocument(html){
  return new Promise((resolve, reject) => {
    const frame = document.createElement("iframe");
    frame.setAttribute("aria-hidden", "true");
    frame.tabIndex = -1;
    Object.assign(frame.style, {position:"fixed", right:"0", bottom:"0", width:"0", height:"0", border:"0", opacity:"0"});
    const pageTitle = document.title;
    const cleanup = () => { document.title = pageTitle; setTimeout(() => frame.remove(), 1000); };
    frame.onload = () => {
      const win = frame.contentWindow;
      if(!win){ frame.remove(); reject(new Error("print frame unavailable")); return; }
      win.addEventListener("afterprint", cleanup, {once:true});
      Promise.resolve(win.document.fonts && win.document.fonts.ready).then(() => {
        document.title = win.document.title;
        win.focus();
        win.print();
        resolve();
      });
    };
    frame.srcdoc = html;
    document.body.append(frame);
  });
}

let tipTimer = 0;

function hideChipTip(){
  clearTimeout(tipTimer);

}

function placeChipTip(anchor){
  const tip = document.querySelector("#chip-tip");
  const canvas = document.querySelector("#canvas").getBoundingClientRect();
  const host = anchor.getBoundingClientRect();
  const box = tip.getBoundingClientRect();
  const gap = 8;
  let left = host.left + host.width / 2 - box.width / 2;
  left = Math.max(canvas.left + 12, Math.min(left, canvas.right - box.width - 12));
  let top = host.top - box.height - gap;
  if(top < canvas.top + 8) top = host.bottom + gap;
  if(top + box.height > canvas.bottom - 8) top = Math.max(canvas.top + 8, host.top - box.height - gap);
  tip.style.left = `${Math.round(left)}px`;
  tip.style.top = `${Math.round(top)}px`;
}

function wantsTip(el){
  const body = (el.dataset.tip || "").trim();
  if(!body) return false;
  const text = el.querySelector(".node-title") || el.querySelector("span, b");
  if(text && (text.scrollWidth > text.clientWidth + 1 || text.scrollHeight > text.clientHeight + 1)) return true;
  const visible = (text ? text.textContent : "").replace(/\s+/g, "");
  return body.replace(/\s+/g, "").length > visible.length;
}

function openChipTip(el){
  if(!el.isConnected || !wantsTip(el)){
    hideChipTip();
    return;
  }
  const tip = document.querySelector("#chip-tip");
  const action = el.dataset.tipAction || "";
  const body = el.dataset.tip || "";
  const frame = document.querySelector("#canvas").getBoundingClientRect();
  tip.style.maxWidth = `${Math.max(180, Math.min(300, frame.width - 24))}px`;
  tip.replaceChildren();
  tip.style.setProperty("--mark", getComputedStyle(el).getPropertyValue("--mark").trim() || "#9ec9d6");
  if(action){
    const lead = document.createElement("b");
    lead.textContent = action;
    tip.append(lead);
  }
  const text = document.createElement("span");
  text.textContent = body;
  tip.append(text);
  tipAnchor = el;
  placeChipTip(el);
  tip.classList.add("show");
}

function scheduleChipTip(el, delay){
  clearTimeout(tipTimer);

    const next = Math.max(0.12, Math.min(2, scale * (event.deltaY < 0 ? 1.08 : 0.92)));

    const wy = (sy - panY) / scale;
    scale = next;
    panX = sx - wx * scale;
    panY = sy - wy * scale;
  } else {
    panX -= event.deltaX;
    panY -= event.deltaY;
  }
  userMoved = true;
  holdScale = true;

}, {passive: false});

function applyView(payload){
  if(view?.revision && payload.revision === view.revision) return;
  (payload.nodes || []).forEach(node => {
    const cached = nodeDetails.get(node.id);
    if(cached && cached.revision === node.steps_revision){
      node.steps = cached.steps;
      node.steps_loaded = true;
    }
  });
  const structural = !view || payload.version !== view.version || structureKey(payload) !== structureKey(view);
  const activity = liveKey(payload) !== liveKey(view) || sizeKey(payload) !== sizeKey(view);
  view = payload;
  if(selected){
    const parent = nodeById(selected);
    if(parent) renderChildren(parent);
  }
  const key = view.ok ? boundsKey() : "";
  const refit = Boolean(key && key !== fittedKey);
  if(refit){
    if(!userMoved) fit();
    fittedKey = key;
  }
  if(structural || refit || activity){
    if(selected && !(view.nodes || []).some(node => node.id === selected)) selected = null;
    if(selected) select(selected);
    else draw();
  }
}

function scheduleRefresh(){

  refreshTimer = setTimeout(refresh, Math.min(15000,1000 * 2 ** refreshFailures));

async function refresh(){
  if(entryLocked || refreshBusy || document.hidden) return;
  clearTimeout(refreshTimer);
  refreshBusy = true;
  try {
    const url = endpoint("snapshot");
    const tag = responseTags.get(url);
    const response = await fetch(url,{cache:"no-store",signal:AbortSignal.timeout(15000),headers:tag ? {"If-None-Match":tag} : {}});
    if(response.status !== 304){
      if(!response.ok) throw new Error("view request failed");
      const payload = await response.json();
      const etag = response.headers.get("ETag");
      if(etag) responseTags.set(url,etag);
      if(!entryLocked) applyView(payload);
    }
    refreshFailures = 0;
  } catch (error) {
    refreshFailures = Math.min(4,refreshFailures + 1);
    if(!entryLocked && !view?.ok){
      view = {ok:false, message:"星图服务没有返回数据，正在重试。"};
      draw();
    }
  } finally {
    refreshBusy = false;
    scheduleRefresh();
  }
}

  function syncModelTag(){
    const tag = $("#model-tag");
    $("#cp-model").innerHTML = tag && !tag.hidden ? tag.innerHTML : "";
  }
  function openPanel(focus = true){
    if(st.open || !st.avail) return;
    st.open = true;
    syncModelTag();
    const pill = $("#ask-pill").getBoundingClientRect();
    const from = cp.getBoundingClientRect();
    cp.classList.add("on");
    cp.removeAttribute("inert");
    cp.setAttribute("aria-hidden", "false");
    dock.classList.add("gone");
    report.classList.add("chat-open");
    if(!reduce() && from.width){
      const dx = pill.left - from.left, dy = pill.top - from.top;
      cp.animate([
        {transform:`translate(${dx}px,${dy}px) scale(${pill.width / from.width},${pill.height / from.height})`, borderRadius:"999px", opacity:.9},
        {transform:"none", borderRadius:"0px", opacity:1},
      ], {duration:440, easing:SPRING});
      cp.firstElementChild.animate([{opacity:0},{opacity:0, offset:.4},{opacity:1}], {duration:440, easing:"ease-out"});
    }else{
      cp.animate([{opacity:0},{opacity:1}], {duration:140});
    }
    restagger();
    toBottom(true);
    if(focus) setTimeout(() => input.focus({preventScroll:true}), reduce() ? 0 : 260);
  }
  async function closePanel(){
    if(!st.open) return;
    st.open = false;
    const pill = $("#ask-pill").getBoundingClientRect();
    const from = cp.getBoundingClientRect();
    dock.classList.remove("gone");
    report.classList.remove("chat-open");
    cp.setAttribute("aria-hidden", "true");
    cp.setAttribute("inert", "");
    const gen = st.gen;
    if(!reduce() && from.width){
      const dx = pill.left - from.left, dy = pill.top - from.top;
      cp.firstElementChild.animate([{opacity:1},{opacity:0, offset:.45},{opacity:0}], {duration:300, fill:"forwards"});
      const anim = cp.animate([
        {transform:"none", opacity:1},
        {transform:`translate(${dx}px,${dy}px) scale(${pill.width / from.width},${pill.height / from.height})`, opacity:.2},
      ], {duration:300, easing:"cubic-bezier(.5,0,.6,1)"});
      await anim.finished.catch(() => {});
    }
    if(!st.open && gen === st.gen){
      cp.classList.remove("on");
      cp.getAnimations({subtree:true}).forEach(a => a.cancel());
    }
    if(!st.open) $("#ask-main").focus({preventScroll:true});
  }
  $("#ask-main").addEventListener("click", () => openPanel());
  $("#ask-fork").addEventListener("click", () => { openPanel(false); startFollowup(); });
  $("#cp-collapse").addEventListener("click", closePanel);
  document.addEventListener("keydown", event => {
    if(event.key !== "Escape" || event.cancelBubble || !st.open || !modal.classList.contains("open")) return;
    event.stopPropagation();
    closePanel();
  }, true);

  /* ---- composer ---- */
  function grow(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
    sendBtn.disabled = st.sending || !input.value.trim();
  }
  input.addEventListener("input", grow);
  input.addEventListener("keydown", event => {
    if(event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229){
      event.preventDefault();
      submit();
    }
  });
  sendBtn.addEventListener("click", submit);
  $("#cp-fork").addEventListener("click", startFollowup);
  emptyEl.addEventListener("click", event => {
    const btn = event.target.closest(".cp-sugs button");
    if(btn) send(btn.textContent);
  });
  function setQuote(text){
    st.quote = String(text || "").trim().slice(0, 600);
    quoteBox.hidden = !st.quote;
    $("#cp-quote-text").textContent = st.quote;
  }
  $("#cp-quote-x").addEventListener("click", () => { setQuote(""); input.focus(); });
  function submit(){
    const text = input.value.trim();
    if(!text || st.sending) return;
    input.value = "";
    grow();
    send(text);
  }

  async function send(text){
    if(st.sending || !text) return;
    const gen = st.gen;
    const quote = st.quote;
    setQuote("");
    st.sending = true;
    // drop a previous failed turn
    thread.querySelectorAll(".msg.failed").forEach(el => el.remove());
    const content = quote ? quote.split("\n").map(line => "> " + line).join("\n") + "\n\n" + text : text;
    const uel = userEl(content);
    const ael = document.createElement("div");
    ael.className = "msg a";
    ael.innerHTML = `<div class="md"><span class="think">${ORB}</span></div>`;
    ael.querySelector(".orb-wrap").classList.add("thinking");
    thread.append(uel, ael);
    const md = ael.firstElementChild;
    syncChrome();
    setThinking(true);
    toBottom(true);
    let buf = "", doneMsg = null, failure = "";
    st.ctl = new AbortController();
    const paint = () => {
      st.raf = 0;
      md.innerHTML = mdHtml(buf, true);
      setCaret(md, true);
      toBottom();
    };
    try{
      const res = await fetch(`${API}/chat`, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({message:content}), signal:st.ctl.signal});
      if(!res.ok){
        let payload = {};
        try{ payload = await res.json(); }catch(error){}
        throw new ChatError(payload.error || "网络断了，稍后再试。");
      }
      for await (const event of sse(res)){
        if(gen !== st.gen) return;
        if(event.ev === "delta"){
          buf += event.data.text || "";
          setThinking(false);
          if(!st.raf) st.raf = requestAnimationFrame(paint);
        }else if(event.ev === "done"){
          doneMsg = event.data.message;
        }else if(event.ev === "error"){
          throw new ChatError(event.data.error || "网络断了，稍后再试。");
        }
      }
      if(!doneMsg) throw new ChatError("网络断了，稍后再试。");
    }catch(error){
      if(gen !== st.gen) return;
      failure = error instanceof ChatError ? error.message : "网络断了，稍后再试。";
    }
    if(gen !== st.gen) return;
    cancelAnimationFrame(st.raf); st.raf = 0;
    st.sending = false;
    st.ctl = null;
    setThinking(false);
    if(failure){
      uel.classList.add("failed"); ael.classList.add("failed");
      md.innerHTML = (buf ? mdHtml(buf) : "") + `<div class="err"></div>`;
      md.querySelector(".err").textContent = failure;
      if(!input.value.trim()){ input.value = text; grow(); }
      if(quote && !st.quote) setQuote(quote);
    }else{
      md.innerHTML = mdHtml(doneMsg.content);
      setCaret(md, false);
      st.msgs.push({role:"user", content}, doneMsg);
      pulse();
    }
    syncChrome();
    toBottom();
  }
  class ChatError extends Error {}
  async function* sse(res){
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      buf = (buf + dec.decode(value, {stream:true})).replace(/\r\n/g, "\n");
      let at;
      while((at = buf.indexOf("\n\n")) >= 0){
        const block = buf.slice(0, at);
        buf = buf.slice(at + 2);
        let ev = "message"; const data = [];
        for(const line of block.split("\n")){
          if(line.startsWith(":")) continue;
          if(line.startsWith("event:")) ev = line.slice(6).trim();
          else if(line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
        }
        if(data.length){
          let parsed = null;
          try{ parsed = JSON.parse(data.join("\n")); }catch(error){}
          if(parsed) yield {ev, data:parsed};
        }
      }
    }
  }

  /* ---- clear ---- */
  clearBtn.addEventListener("click", async () => {
    if(!clearBtn.classList.contains("armed")){
      clearBtn.classList.add("armed");
      clearTimeout(st.clearTimer);
      st.clearTimer = setTimeout(() => clearBtn.classList.remove("armed"), 3000);
      return;
    }
    clearTimeout(st.clearTimer);
    clearBtn.classList.remove("armed");
    if(st.sending && st.ctl) st.ctl.abort();
    st.gen++;
    st.sending = false; setThinking(false);
    try{ await fetch(`${API}/chat`, {method:"DELETE"}); }catch(error){}
    st.msgs = [];
    thread.replaceChildren();
    syncChrome();
    restagger();
  });

  /* ---- selection -> 问这段 ---- */
  let selText = "";
  function updateSel(){
    const sel = window.getSelection();
    const hide = () => { selBtn.hidden = true; };
    if(!st.avail || !modal.classList.contains("open") || !sel || sel.isCollapsed || !sel.rangeCount) return hide();
    const range = sel.getRangeAt(0);
    if(!body.contains(range.commonAncestorContainer)) return hide();
    const text = sel.toString().trim();
    if(text.length < 4) return hide();
    const rects = range.getClientRects();
    const last = rects[rects.length - 1] || range.getBoundingClientRect();
    if(!last || (!last.width && !last.height)) return hide();
    selText = text;
    selBtn.hidden = false;
    const coarse = window.matchMedia("(pointer: coarse)").matches;
    const w = selBtn.offsetWidth || 86;
    let left = Math.min(Math.max(8, last.right - w / 2), window.innerWidth - w - 8);
    let top = coarse || last.top < 56 ? last.bottom + 10 : last.top - 42;
    top = Math.min(top, window.innerHeight - 44);
    selBtn.style.left = left + "px";
    selBtn.style.top = top + "px";
  }
  let selTimer = 0;
  document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(updateSel, 120); });
  body.addEventListener("scroll", () => { selBtn.hidden = true; }, {passive:true});
  selBtn.addEventListener("mousedown", event => event.preventDefault());
  selBtn.addEventListener("pointerdown", event => event.preventDefault());
  selBtn.addEventListener("click", () => {
    setQuote(selText);
    selBtn.hidden = true;
    window.getSelection().removeAllRanges();
    if(st.open) input.focus({preventScroll:true}); else openPanel();
  });

  /* ---- follow-up draft ---- */
  function readModel(){
    try{ const value = localStorage.getItem(MODEL_KEY); return Object.hasOwn(MODELS, value) ? value : "deepseek"; }catch(error){ return "deepseek"; }
  }
  const markHtml = id => `<i class="mm mm-${id}" aria-hidden="true">${MODEL_GLYPH[id]}</i>`;
  function draftHtml(){
    const id = readModel();
    return `<div class="dr-top">${ORB}${FORK}<span class="dr-status">整理中…</span></div>
<div class="dr-lines"><i></i><i></i><i></i></div>
<div class="dr-err" hidden></div>
<textarea class="dr-ta" rows="3" maxlength="4000" aria-label="继续调研" hidden></textarea>
<div class="dr-foot"><div class="dr-chip-wrap"><button type="button" class="dr-chip" aria-haspopup="menu" aria-expanded="false" aria-label="研究模型">${markHtml(id)}<span>${MODELS[id].short}</span>${CHEV}</button><div class="dr-menu" role="menu" hidden>${Object.keys(MODELS).map(key => `<button type="button" role="menuitemradio" data-id="${key}" aria-checked="${key === id}">${markHtml(key)}<span class="grow">${MODELS[key].name}</span>${CHECK}</button>`).join("")}</div></div><i class="grow"></i><button type="button" class="ghost">取消</button><button type="button" class="go" disabled>开始调研</button></div>`;
  }
  function paintModel(card){
    const id = card.model;
    const chip = card.el.querySelector(".dr-chip");
    chip.innerHTML = `${markHtml(id)}<span>${MODELS[id].short}</span>${CHEV}`;
    chip.classList.remove("swap"); void chip.offsetWidth; if(!reduce()) chip.classList.add("swap");
    card.el.querySelectorAll(".dr-menu button").forEach(btn => {
      const on = btn.dataset.id === id;
      btn.setAttribute("aria-checked", String(on));
      btn.querySelector(".ok").style.visibility = on ? "visible" : "hidden";
    });
  }
  function dropDraft(){
    const card = st.draft;
    if(!card) return;
    card.dead = true;
    if(card.ctl) card.ctl.abort();
    card.el.remove();
    st.draft = null;
    syncChrome();
  }
  async function startFollowup(){
    if(!st.avail || (st.draft && st.draft.busy)) return;
    if(!st.open) openPanel(false);
    const hint = input.value.trim();
    input.value = ""; grow();
    dropDraft();
    const el = document.createElement("div");
    el.className = "draft";
    el.dataset.s = "loading";
    el.innerHTML = draftHtml();
    el.querySelector(".orb-wrap").classList.add("thinking");
    tail.append(el);
    const card = st.draft = {el, model:readModel(), busy:false, dead:false, ctl:new AbortController(), question:"", typing:false};
    paintModel(card); el.querySelector(".dr-chip").classList.remove("swap");
    syncChrome();
    toBottom(true);
    setThinking(true);
    const ta = el.querySelector(".dr-ta"), go = el.querySelector(".go"), errEl = el.querySelector(".dr-err");
    const fail = message => {
      el.dataset.s = "error";
      errEl.hidden = false;
      errEl.textContent = message;
      el.querySelector(".dr-status").textContent = "";
    };
    el.querySelector(".ghost").addEventListener("click", dropDraft);
    const chip = el.querySelector(".dr-chip"), menu = el.querySelector(".dr-menu");
    chip.addEventListener("click", () => { menu.hidden = !menu.hidden; chip.setAttribute("aria-expanded", String(!menu.hidden)); });
    menu.addEventListener("click", event => {
      const btn = event.target.closest("button");
      if(!btn) return;
      card.model = btn.dataset.id;
      try{ localStorage.setItem(MODEL_KEY, card.model); }catch(error){}
      menu.hidden = true; chip.setAttribute("aria-expanded", "false");
      paintModel(card);
    });
    ta.addEventListener("input", () => { sizeTa(ta); go.disabled = !ta.value.trim() || card.busy; });
    go.addEventListener("click", () => spawn(card));
    let question = "";
    try{
      const res = await fetch(`${API}/followup`, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(hint ? {hint} : {}), signal:card.ctl.signal});
      const payload = await res.json().catch(() => ({}));
      if(card.dead) return;
      if(!res.ok || !payload.question) throw new ChatError(payload.error || "网络断了，稍后再试。");
      question = String(payload.question).trim();
    }catch(error){
      if(card.dead) return;
      setThinking(false);
      fail(error instanceof ChatError ? error.message : "网络断了，稍后再试。");
      return;
    }
    setThinking(false);
    pulse();
    el.dataset.s = "ready";
    el.querySelector(".dr-status").textContent = "继续调研";
    ta.hidden = false;
    ta.classList.add("typing");
    card.typing = true;
    if(reduce()){ ta.value = question; }
    else{
      const step = Math.max(1, Math.ceil(question.length / 90));
      for(let i = 0; i < question.length && !card.dead; i += step){
        ta.value = question.slice(0, i + step);
        sizeTa(ta);
        toBottom();
        await wait(16);
      }
    }
    if(card.dead) return;
    ta.value = question;
    ta.classList.remove("typing");
    card.typing = false;
    sizeTa(ta);
    go.disabled = !ta.value.trim();
    toBottom();
    ta.focus({preventScroll:true});
  }
  function sizeTa(ta){
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight + 2, 240) + "px";
  }

  async function spawn(card){
    const el = card.el, ta = el.querySelector(".dr-ta"), go = el.querySelector(".go");
    const question = ta.value.trim();
    if(!question || card.busy || card.typing) return;
    card.busy = true;
    go.disabled = true;
    go.textContent = "开始调研";
    let row;
    try{
      const res = await fetch("/api/questions", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({question, model:card.model, parent:STUDY_ID})});
      const payload = await res.json().catch(() => ({}));
      if(!res.ok || !payload.id) throw new ChatError(payload.error || "网络断了，稍后再试。");
      row = payload;
    }catch(error){
      card.busy = false;
      go.disabled = false;
      const errEl = el.querySelector(".dr-err");
      errEl.hidden = false;
      errEl.textContent = error instanceof ChatError ? error.message : "网络断了，稍后再试。";
      return;
    }
    const href = row.href || studyHref(row.id);
    const rect = el.getBoundingClientRect();
    const h0 = rect.height;
    const area = cp.getBoundingClientRect();
    const orbBox = cp.querySelector(".cp-head .orb-wrap").getBoundingClientRect();
    const start = {x: orbBox.left + orbBox.width / 2 - area.left, y: orbBox.top + orbBox.height / 2 - area.top};
    const end = {x: rect.left + 25 - area.left, y: rect.top + 24 - area.top};
    const anim = !reduce();
    if(anim){
      el.classList.add("leaving");
      await wait(180);
    }
    el.classList.remove("leaving");
    el.dataset.s = "ok";
    el.innerHTML = `<div class="dr-ok"><svg class="nd" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="#143a2d" stroke="#58d69a" stroke-width="1.6"/><circle cx="11" cy="11" r="3" fill="#58d69a"/></svg><b>新研究已开始</b><a href="${escapeHtml(href)}">前往 →</a></div>`;
    if(anim){
      const h1 = el.getBoundingClientRect().height;
      el.animate([{height: h0 + "px"}, {height: h1 + "px"}], {duration:320, easing:"cubic-bezier(.22,1,.36,1)"});
      drawSpawn(start, end);
    }
    st.draft = null;
    st.followups.push({id:row.id, title:row.title || question, status:row.status || "running"});
    renderLineage(true);
    pulse();
    syncChrome();
  }
  function drawSpawn(a, b){
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "spawn");
    const bend = Math.max(60, Math.abs(b.y - a.y) * .35);
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", `M${a.x} ${a.y} C${a.x - bend} ${a.y + 30},${b.x - bend} ${b.y - 40},${b.x} ${b.y}`);
    const circle = document.createElementNS(NS, "circle");
    circle.setAttribute("class", "nd-c"); circle.setAttribute("cx", b.x); circle.setAttribute("cy", b.y); circle.setAttribute("r", 8);
    const ring = document.createElementNS(NS, "circle");
    ring.setAttribute("class", "nd-r"); ring.setAttribute("cx", b.x); ring.setAttribute("cy", b.y); ring.setAttribute("r", 8);
    svg.append(path, ring, circle);
    cp.querySelector(".cp-inner").append(svg);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    const draw = path.animate([{strokeDashoffset:len, opacity:1},{strokeDashoffset:0, opacity:1}], {duration:620, easing:"cubic-bezier(.5,0,.2,1)", fill:"forwards"});
    circle.animate([{transform:"scale(0)", opacity:0, offset:0},{transform:"scale(0)", opacity:0, offset:.6},{transform:"scale(1.35)", opacity:1, offset:.82},{transform:"scale(1)", opacity:1}], {duration:760, easing:"ease-out", fill:"forwards"});
    ring.animate([{transform:"scale(1)", opacity:0, offset:.55},{transform:"scale(1)", opacity:.9, offset:.6},{transform:"scale(3.2)", opacity:0}], {duration:1100, easing:"ease-out", fill:"forwards"});
    draw.finished.then(() => wait(700)).then(() => {
      svg.animate([{opacity:1},{opacity:0}], {duration:320, fill:"forwards"}).finished.then(() => svg.remove());
    }).catch(() => svg.remove());
  }
  document.addEventListener("pointerdown", event => {
    document.querySelectorAll(".dr-menu:not([hidden])").forEach(menu => {
      if(menu.parentElement.contains(event.target)) return;
      menu.hidden = true;
      menu.previousElementSibling.setAttribute("aria-expanded", "false");
    });
  });

  /* ---- lifecycle ---- */
  function reset(){
    st.gen++;
    if(st.ctl) st.ctl.abort();
    if(st.draft && st.draft.ctl) st.draft.ctl.abort();
    cancelAnimationFrame(st.raf); st.raf = 0;
    Object.assign(st, {open:false, avail:false, msgs:[], sending:false, quote:"", stick:true, ctl:null, parent:null, followups:[], draft:null});
    cp.getAnimations({subtree:true}).forEach(a => a.cancel());
    cp.classList.remove("on"); cp.setAttribute("inert", ""); cp.setAttribute("aria-hidden", "true");
    report.classList.remove("chat-open", "has-chat");
    dock.hidden = true; dock.classList.remove("gone");
    thread.replaceChildren(); tail.replaceChildren();
    input.value = ""; input.style.height = ""; setQuote("");
    clearBtn.classList.remove("armed");
    selBtn.hidden = true;
    setThinking(false);
    renderLineage();
    syncChrome();
  }
  async function load(){
    const gen = st.gen;
    try{
      const res = await fetch(`${API}/chat`);
      if(!res.ok) return;
      const data = await res.json();
      if(gen !== st.gen) return;
      st.avail = !!data.available;
      st.msgs = Array.isArray(data.messages) ? data.messages : [];
      st.parent = data.parent || null;
      st.followups = Array.isArray(data.followups) ? data.followups : [];
    }catch(error){ return; }
    renderLineage();
    report.classList.toggle("has-chat", st.avail);
    dock.hidden = !st.avail;
    renderThread();
  }
  document.addEventListener("report-open", () => { reset(); load(); });
})();

</script>
