<script>
let thumbEntry = null;
const entryPreview = /(?:^|[?&])entry-preview=1(?:&|$)/.test(location.search || "") && window.parent !== window;
if(entryPreview) document.documentElement.classList.add("entry-preview");
function readThumbEntry(raw, path, now){
  try{
    const entry = JSON.parse(raw);
    if(!entry || entry.href !== path || now - entry.at < 0 || now - entry.at > 10000) return null;
    if(!Number.isFinite(entry.at)) return null;
    const snapshot = entry.view;
    if(!snapshot || !Number.isFinite(snapshot.at) || now - snapshot.at < 0 || now - snapshot.at > 30000) return null;
    if(!snapshot.payload || typeof snapshot.payload.ok !== "boolean") return null;
    if(snapshot.payload.ok && (!Array.isArray(snapshot.payload.nodes) || !Array.isArray(snapshot.payload.edges))) return null;
    return entry;
  }catch(err){ return null; }
}
try{
  const raw = sessionStorage.getItem("piresearch-zoom");
  sessionStorage.removeItem("piresearch-zoom");
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    thumbEntry = readThumbEntry(raw, location.pathname, Date.now());
  }
}catch(err){}
</script>

/* ---- report chat ---- */
@property --cw{syntax:"<length>";inherits:true;initial-value:0px}
.report{position:relative;grid-template-columns:minmax(0,1fr) var(--cw);transition:width .42s cubic-bezier(.34,1.18,.5,1),--cw .42s cubic-bezier(.34,1.18,.5,1)}
.report header{grid-column:1/-1}
.report.chat-open{--cw:410px;width:min(1456px,calc(100vw - 64px))}
.rh-text{display:flex;flex-direction:column;gap:5px;min-width:0}
.report.has-chat .prose{padding-bottom:132px}
.lineage{display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:relative}
.lineage[hidden]{display:none}
.lin{display:inline-flex;align-items:center;gap:5px;max-width:300px;height:22px;padding:0 9px;border:1px solid #dfe5e2;border-radius:999px;background:#f6f8f7;color:#5c6b71;font-size:12px;font-weight:540;line-height:1;text-decoration:none;white-space:nowrap;transition:background .16s,color .16s,border-color .16s}
.lin span{overflow:hidden;text-overflow:ellipsis}
.lin svg{flex:none;width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lin:hover,.lin[aria-expanded="true"]{background:#eaf1ef;border-color:#c5d4cf;color:#1f4f5c}
.report header button.lin{display:inline-flex;flex-direction:row;gap:6px;width:auto;height:22px;padding:0 6px 0 9px;border:1px solid #dfe5e2;border-radius:999px;background:#f6f8f7;font-size:12px;font-weight:540;color:#5c6b71}
.report header button.lin:hover,.report header button.lin[aria-expanded="true"]{background:#eaf1ef;color:#1f4f5c}
.lin b{display:inline-block;min-width:14px;padding:1px 4px;border-radius:99px;background:#246477;color:#fff;font-size:10px;font-weight:650;text-align:center;line-height:1.3;-webkit-line-clamp:unset}
.report header .lin b{display:inline-block;font-size:10px;color:#fff;line-height:1.3}
.lin.pop b{animation:lin-pop .6s cubic-bezier(.34,1.8,.5,1)}
@keyframes lin-pop{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.lin-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:8;min-width:240px;max-width:min(420px,80vw);padding:5px;border:1px solid #e1e6e3;border-radius:12px;background:#fff;box-shadow:0 16px 44px rgba(20,40,40,.2);transform-origin:0 0;animation:dl-menu-in .18s cubic-bezier(.16,1,.3,1)}
.lin-menu[hidden]{display:none}
.lin-menu a{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;color:#34434a;font-size:13px;font-weight:540;line-height:1.4;text-decoration:none}
.lin-menu a span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin-menu a:hover,.lin-menu a:focus-visible{background:#f1f4f3;color:#1c2b31;outline:none}
.sdot{flex:none;width:7px;height:7px;border-radius:50%;background:#a8b3b8}
.sdot.running{background:#25b6c8;box-shadow:0 0 0 0 #25b6c888;animation:sdot 1.6s ease-out infinite}
.sdot.finished{background:#3aa876}
.sdot.failed{background:#e0525f}
@keyframes sdot{to{box-shadow:0 0 0 6px #25b6c800}}

/* orb */
.orb-wrap{position:relative;flex:none;display:inline-block;width:24px;height:24px}
.orb-wrap.big{width:64px;height:64px}
.orb{position:absolute;inset:0;display:block;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 28%,#e6fdff 0,#48d3e4 26%,#6d9cff 60%,#8d6bff 100%);box-shadow:0 0 12px rgba(72,211,228,.55),0 0 28px rgba(109,156,255,.28),inset -3px -4px 8px rgba(50,24,130,.5);animation:orb-breathe 3.8s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent 0,rgba(255,255,255,.55) 14%,transparent 38%,rgba(170,140,255,.5) 70%,transparent 90%);mix-blend-mode:soft-light;animation:orb-spin 7s linear infinite}
.orb::after{content:"";position:absolute;left:20%;top:14%;width:34%;height:24%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1.5px);transform:rotate(-24deg)}
.orb-wrap.big .orb{box-shadow:0 0 28px rgba(72,211,228,.5),0 0 70px rgba(109,156,255,.3),inset -8px -10px 18px rgba(50,24,130,.5)}
.sat{position:absolute;inset:-7px;opacity:0;pointer-events:none;transition:opacity .25s;animation:orb-spin 1.15s linear infinite}
.sat::after{content:"";position:absolute;left:50%;top:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#aef4fb;box-shadow:0 0 6px #48d3e4,0 0 12px #48d3e4aa}
.sat.s2{inset:-10px;animation-duration:1.7s;animation-direction:reverse;animation-delay:-.5s}
.sat.s2::after{background:#cdbfff;box-shadow:0 0 6px #aa8cff}
.sat.s3{inset:-4px;animation-duration:.9s;animation-delay:-.3s}
.orb-wrap.big .sat{inset:-14px}.orb-wrap.big .sat.s2{inset:-20px}.orb-wrap.big .sat.s3{inset:-8px}
.orb-wrap.thinking .sat{opacity:1}
.orb-wrap.pulse::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px #7ee6f2;animation:orb-ring .7s ease-out forwards}
@keyframes orb-breathe{0%,100%{transform:scale(.94);filter:brightness(.95)}50%{transform:scale(1.04);filter:brightness(1.12)}}
@keyframes orb-spin{to{transform:rotate(360deg)}}
@keyframes orb-ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}

/* ask bar */
.ask-dock{position:absolute;left:0;right:var(--cw);bottom:22px;z-index:5;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.ask-dock[hidden]{display:none}
.ask-pill{pointer-events:auto;display:flex;align-items:center;gap:4px;width:min(440px,100%);height:50px;padding:0 7px 0 8px;border:1px solid #2c363b;border-radius:999px;background:linear-gradient(180deg,#1b2327,#12171a);box-shadow:0 14px 40px rgba(10,24,28,.34),0 2px 0 rgba(255,255,255,.04) inset;transition:opacity .16s ease,transform .3s cubic-bezier(.34,1.5,.5,1),box-shadow .2s,border-color .2s;animation:ask-in .6s cubic-bezier(.34,1.4,.5,1) .15s both}
.ask-pill:hover{border-color:#3d4b52;box-shadow:0 18px 46px rgba(10,24,28,.42),0 0 0 4px rgba(72,211,228,.1)}
.ask-dock.gone .ask-pill{opacity:0;pointer-events:none;animation:none}
.ask-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:100%;padding:0 4px;border:0;background:transparent;color:#8d9aa0;font-size:14px;text-align:left;border-radius:999px}
.ask-main:focus-visible,.ask-fork:focus-visible{outline:2px solid #48d3e4;outline-offset:2px}
.ask-main span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ask-fork{flex:none;display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid #2f3a40;border-radius:50%;background:#1f282c;color:#9fe8f1;transition:background .16s,color .16s,transform .25s cubic-bezier(.34,1.8,.5,1)}
.ask-fork:hover{background:#27343a;color:#fff;transform:rotate(-12deg) scale(1.08)}
.ask-fork svg,.cp-fork svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes ask-in{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}

/* selection button */
.ask-sel{position:fixed;z-index:40;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px 0 10px;border:1px solid #33414a;border-radius:999px;background:#151b1e;color:#e8f6f8;font-size:13px;font-weight:560;box-shadow:0 10px 28px rgba(0,0,0,.35);animation:sel-in .22s cubic-bezier(.34,1.6,.5,1);transform-origin:50% 100%}
.ask-sel[hidden]{display:none}
.ask-sel svg{width:15px;height:15px;fill:none;stroke:#6fdbe9;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ask-sel:hover{background:#1f292e;border-color:#48d3e4}
@keyframes sel-in{from{opacity:0;transform:translateY(6px) scale(.8)}to{opacity:1;transform:none}}

/* panel */
.cp{position:absolute;right:0;top:var(--head-h,64px);bottom:0;z-index:6;width:410px;transform-origin:0 0;background:#10161a;color:#dde6e9;border-left:1px solid #1e282d;visibility:hidden;overflow:hidden}
.cp.on{visibility:visible}
.cp-inner{position:relative;display:flex;flex-direction:column;width:100%;height:100%;min-height:0}
.cp-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 16px;border-bottom:1px solid #1d272c}
.cp-head b{font-size:14px;font-weight:620;color:#f0f6f7;letter-spacing:.01em}
.cp-model{display:inline-flex;align-items:center;gap:5px;color:#7f8d93;font-size:12px;font-weight:560}
.cp-model:empty{display:none}
.grow{flex:1}
.cp-head button{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:8px;background:transparent;color:#80919a;transition:background .16s,color .16s}
.cp-head button[hidden]{display:none}
.cp-head button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cp-head button:hover{background:#1c262b;color:#e8f2f4}
.cp-head button.armed{background:#3a1c22;color:#ff7d8a;animation:armed .3s}
.cp-head button:focus-visible{outline:2px solid #48d3e4;outline-offset:1px}
@keyframes armed{50%{transform:scale(1.18)}}
.cp-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 12px;scrollbar-width:thin;scrollbar-color:#2a363c transparent}
.cp-empty{display:flex;flex-direction:column;align-items:center;gap:30px;padding:46px 0 8px}
.cp-empty[hidden]{display:none}
.cp-sugs{display:flex;flex-direction:column;align-items:stretch;gap:9px;width:100%}
.cp-sugs button{padding:11px 16px;border:1px solid #243038;border-radius:14px;background:#151d21;color:#c3d1d6;font-size:14px;text-align:left;opacity:0;animation:sug-in .5s cubic-bezier(.34,1.3,.5,1) calc(.25s + var(--i)*.09s) forwards;transition:background .16s,border-color .16s,color .16s,transform .2s}
.cp-sugs button:hover{background:#1b272c;border-color:#3b8d99;color:#fff;transform:translateX(3px)}
.cp-sugs button:focus-visible{outline:2px solid #48d3e4;outline-offset:2px}
@keyframes sug-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.msg{margin:0 0 16px;animation:msg-in .32s cubic-bezier(.22,1,.36,1)}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.u{display:flex;justify-content:flex-end}
.bub{max-width:88%;padding:9px 14px;border-radius:18px 18px 4px 18px;background:linear-gradient(145deg,#1f6f7c,#2a4f9a);color:#f3fbfc;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.bub .q{display:block;margin:0 0 6px;padding:4px 9px;border-left:2px solid #9ff0f8;border-radius:4px;background:rgba(0,0,0,.2);color:#d3eef3;font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.md{color:#d6e1e5;font-size:14px;line-height:1.75;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 12px}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;color:#f0f6f7;font-size:15px;font-weight:640;line-height:1.5}
.md strong{color:#f4fafb;font-weight:640}
.md a{color:#74dbe8}
.md ul,.md ol{margin:0 0 12px;padding-left:1.3em}
.md li{margin:5px 0}.md li::marker{color:#4aa6b3}
.md blockquote{margin:0 0 12px;padding:6px 12px;border-left:2px solid #3b8d99;background:#151d21;border-radius:0 8px 8px 0}
.md blockquote p{margin:0}
.md code{padding:1px 5px;border-radius:4px;background:#1a252a;color:#9fe1ea;font-family:var(--mono);font-size:.88em}
.md pre{margin:0 0 12px;padding:12px 14px;overflow:auto;border-radius:10px;background:#0b1013}
.md pre code{padding:0;background:transparent}
.md hr{height:1px;margin:16px 0;border:0;background:#25323a}
.md .table-wrap{display:block;margin:0 0 14px;overflow-x:auto;border:1px solid #243038;border-radius:10px}
.md table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.6}
.md th{padding:7px 10px;background:#18222a;color:#9fb4bc;font-size:11.5px;font-weight:620;text-align:left}
.md td{padding:7px 10px;border-top:1px solid #213039;color:#cbd8dc;vertical-align:top;min-width:70px}
.md a.bookmark{display:block;text-decoration:none}
.md .caret::after{content:"";display:inline-block;width:7px;height:1.05em;margin-left:3px;border-radius:2px;vertical-align:-.17em;background:#6fe3f0;box-shadow:0 0 10px #48d3e4,0 0 20px #48d3e488;animation:caret 1s steps(2,jump-none) infinite}
@keyframes caret{50%{opacity:.25}}
.cite{display:inline-flex;align-items:center;gap:3px;max-width:100%;height:20px;margin:0 2px;padding:0 8px 0 6px;border:1px solid #2e5964;border-radius:999px;background:#12292f;color:#8fe6f0;font:inherit;font-size:12px;font-weight:560;line-height:1;vertical-align:1px;white-space:nowrap;transition:background .16s,border-color .16s,transform .2s cubic-bezier(.34,1.8,.5,1)}
.cite:hover{background:#17394180;background:#173941;border-color:#48d3e4;transform:translateY(-1px)}
.cite:focus-visible{outline:2px solid #48d3e4;outline-offset:1px}
.cite i{font-style:normal;color:#48d3e4;font-weight:700}
.cite span{overflow:hidden;text-overflow:ellipsis}
.cite.miss{opacity:.45;cursor:default;border-color:#2a3338;background:#161d20;color:#8a979c}
.cite.miss:hover{transform:none;border-color:#2a3338;background:#161d20}
.think{display:inline-flex;align-items:center;height:30px;padding-left:10px}
.err{margin:2px 0 0;padding:8px 12px;border:1px solid #5a2a32;border-radius:10px;background:#2a161a;color:#ff9aa5;font-size:13px;line-height:1.5}
.prose :is(h1,h2,h3,h4,h5,h6).flash{position:relative}
.prose .flash::after{content:"";position:absolute;inset:-6px -14px;z-index:2;border-radius:8px;pointer-events:none;background:linear-gradient(90deg,rgba(72,211,228,.55),rgba(170,140,255,.3) 60%,transparent);mix-blend-mode:multiply;transform-origin:0 50%;animation:flash-sweep 1.25s cubic-bezier(.22,1,.36,1) both}
@keyframes flash-sweep{0%{transform:scaleX(0);opacity:1}35%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* draft card */
.draft{position:relative;margin:2px 0 16px;padding:13px 14px 12px;border:1px solid #2b4e57;border-radius:16px;background:linear-gradient(160deg,#142228,#10181c);overflow:hidden;animation:msg-in .36s cubic-bezier(.22,1,.36,1)}
.draft::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,#48d3e4,transparent 30%,transparent 70%,#aa8cff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.dr-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:#9fb6bd;font-size:13px;font-weight:560}
.dr-top .orb-wrap{width:20px;height:20px}
.dr-top .sat{inset:-5px}
.dr-top .fk{display:none;width:18px;height:18px;fill:none;stroke:#6fdbe9;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.draft:not([data-s="loading"]) .dr-top .orb-wrap{display:none}
.draft:not([data-s="loading"]) .dr-top .fk{display:block}
.draft:not([data-s="loading"]) .dr-top{color:#d7edf1}
.dr-lines{display:flex;flex-direction:column;gap:9px;padding:2px 0 6px}
.dr-lines i{display:block;height:11px;border-radius:6px;background:linear-gradient(100deg,#1b2a30 20%,#2f5560 45%,#1b2a30 70%);background-size:220% 100%;animation:shimmer 1.4s linear infinite}
.dr-lines i:nth-child(2){width:86%}.dr-lines i:nth-child(3){width:58%}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-100% 0}}
.dr-ta{display:block;width:100%;min-height:78px;max-height:240px;padding:10px 12px;resize:none;border:1px solid #28404a;border-radius:11px;background:#0d1417;color:#e6f2f5;font:inherit;font-size:14px;line-height:1.65;outline:none;transition:border-color .16s,box-shadow .16s}
.dr-ta:focus{border-color:#48d3e4;box-shadow:0 0 0 3px rgba(72,211,228,.15)}
.dr-ta.typing{caret-color:transparent;border-color:#2f6470}
.dr-foot{display:flex;align-items:center;gap:8px;margin-top:11px}
.dr-foot .grow{flex:1}
.dr-foot button.ghost{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#8d9da4;font-size:13px;font-weight:560}
.dr-foot button.ghost:hover{background:#1c282d;color:#e5eef0}
.dr-foot button.go{height:32px;padding:0 16px;border:0;border-radius:9px;background:linear-gradient(135deg,#48d3e4,#6d9cff);color:#04161a;font-size:13px;font-weight:660;box-shadow:0 6px 18px rgba(72,211,228,.25);transition:transform .2s cubic-bezier(.34,1.8,.5,1),filter .16s,opacity .16s}
.dr-foot button.go:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}
.dr-foot button.go:disabled{opacity:.4;cursor:default;box-shadow:none}
.dr-foot button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.draft[data-s="loading"] .dr-ta,.draft[data-s="loading"] .dr-foot .go,.draft[data-s="loading"] .dr-chip,.draft[data-s="error"] .dr-lines,.draft[data-s="error"] .dr-ta,.draft[data-s="error"] .go,.draft[data-s="error"] .dr-chip{display:none}
.draft:not([data-s="loading"]):not([data-s="error"]) .dr-lines{display:none}
.dr-err{color:#ff9aa5;font-size:13px;line-height:1.5}
.dr-err[hidden]{display:none}
.dr-chip-wrap{position:relative}
.dr-chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 7px 0 5px;border:1px solid #333f45;border-radius:9px;background:#1a2428;color:#c8d4d8;font-size:12px;font-weight:600;white-space:nowrap;transition:background .16s,border-color .16s}
.dr-chip .mm{width:18px;height:18px;border-radius:5px}
.dr-chip svg.chev{width:12px;height:12px;fill:none;stroke:#7d8e95;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dr-chip[aria-expanded="true"] svg.chev{transform:rotate(180deg)}
.dr-chip:hover,.dr-chip[aria-expanded="true"]{background:#233036;border-color:#4a5b62;color:#fff}
.dr-chip:focus-visible{outline:2px solid #48d3e4;outline-offset:2px}
.dr-chip.swap .mm{animation:chip-swap2 .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes chip-swap2{from{transform:scale(.4) rotate(-40deg);opacity:0}}
.dr-menu{position:absolute;left:0;bottom:calc(100% + 6px);z-index:12;width:180px;padding:5px;border:1px solid #33414a;border-radius:12px;background:#171f23;box-shadow:0 18px 50px rgba(0,0,0,.6);transform-origin:0 100%;animation:sel-in .18s cubic-bezier(.16,1,.3,1)}
.dr-menu[hidden]{display:none}
.dr-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:transparent;color:#d0dade;font-size:13px;font-weight:550;text-align:left}
.dr-menu button:hover,.dr-menu button:focus-visible{background:#26343a;color:#fff;outline:none}
.dr-menu .grow{flex:1}
.dr-menu svg.ok{width:14px;height:14px;fill:none;stroke:#48d3e4;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dr-menu .mm{width:16px;height:16px;border-radius:5px}
.draft[data-s="ok"]{padding:0 14px;height:48px;border-color:#2c6a56;background:linear-gradient(160deg,#112a24,#10181c)}
.dr-ok{display:flex;align-items:center;gap:11px;height:46px;font-size:13.5px;color:#d3efe5;animation:ok-in .4s ease .55s both}
.dr-ok svg.nd{flex:none;width:22px;height:22px}
.dr-ok b{font-weight:620;color:#eafaf3}
.dr-ok a{margin-left:auto;color:#7ee9bb;font-weight:600;text-decoration:none;white-space:nowrap}
.dr-ok a:hover{text-decoration:underline}
@keyframes ok-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.draft.leaving>*{opacity:0;transition:opacity .2s}
.spawn{position:absolute;inset:0;z-index:9;width:100%;height:100%;pointer-events:none;overflow:visible}
.spawn path{fill:none;stroke:#58d69a;stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 4px #58d69a)}
.spawn .nd-c{fill:#143a2d;stroke:#58d69a;stroke-width:1.6;filter:drop-shadow(0 0 6px #58d69acc);transform-box:fill-box;transform-origin:center}
.spawn .nd-r{fill:none;stroke:#58d69a;stroke-width:1.4;transform-box:fill-box;transform-origin:center}

/* composer */
.cp-foot{padding:6px 14px 14px}
.cp-quote{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 6px 6px 10px;border:1px solid #2a4650;border-left:3px solid #48d3e4;border-radius:10px;background:#12222a;color:#a9d3da;font-size:12.5px;line-height:1.4;animation:msg-in .25s cubic-bezier(.22,1,.36,1)}

<script>
const studyMatch = location.pathname.match(/^\/study\/(.+?)\/?$/);
const API = studyMatch ? "/api/studies/" + studyMatch[1].replace(/\/$/, "") : "";
function endpoint(name){ return API ? `${API}/${name}` : `/api/${name}`; }
function paintSky(){
  const sky = document.querySelector("#sky");
  if(!sky || sky.childElementCount) return;
  let seed = 20261013;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for(let i = 0; i < 168; i++){
    const star = document.createElement("i");
    const roll = rnd();
    const size = roll > 0.94 ? 2.2 : roll > 0.78 ? 1.6 : 1;
    const glow = size > 2 ? 3 : 0;
    star.style.left = `${(rnd() * 100).toFixed(2)}%`;
    star.style.top = `${(rnd() * 100).toFixed(2)}%`;
    star.style.width = star.style.height = `${size}px`;
    star.style.opacity = (0.16 + rnd() * (size > 2 ? 0.55 : 0.38)).toFixed(2);
    if(glow) star.style.boxShadow = `0 0 ${glow}px rgba(214,214,218,.45)`;
    sky.appendChild(star);
  }
}
paintSky();
const STATUS = {open:"未开始", in_progress:"进行中", resolved:"已完成", cancelled:"已取消"};
const REL = {parent:"子节点", audit:"审核", support:"支持", challenge:"挑战", error:"错误"};
const TOOL = {web_search:"搜索", web_fetch:"打开", bash:"命令", read_file:"读取", create_file:"写入", submit_report:"提交", download_file:"下载", "压缩":"压缩", "思考":"思考"};
const TITLE_COLOR = {web_search:"#60a5fa", web_fetch:"#2dd4bf", bash:"#fb923c", read_file:"#a3e635", create_file:"#f472b6", submit_report:"#e879f9", download_file:"#818cf8", "压缩":"#f9a8d4", "思考":"#fdba74"};
const MARK = {web_search:"#48d3e4", web_fetch:"#6d9cff", bash:"#8ea0b3", read_file:"#aa8cff", create_file:"#58d69a", submit_report:"#f4c56a", "压缩":"#7ddec8", "思考":"#48d3e4"};
const responseTags = new Map();
const nodeDetails = new Map();
const detailRequests = new Map();
let refreshTimer = 0;
let refreshBusy = false;
let refreshFailures = 0;
let view = null;
let scale = 1;
let selected = null;
let selectionTransition = false;
let activeStep = null;
let fittedKey = "";
let holdScale = false;
let panX = 0;
let panY = 0;
let userMoved = false;
let chipHost = null;
let revealedFor = null;
let burstId = "";
let burstAt = 0;
let glideToken = 0;
const haloSeen = new Map();
const toneSeen = new Map();
const goalWorkObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => entry.target.classList.toggle("work-offscreen", !entry.isIntersecting));
}, {root:document.querySelector("#canvas")});
const BURST_STEP = 18;
const BURST_MS = 340;

function shortTitle(text){
  const cleaned = String(text || "").replace(/^#\s*Task\s*/i, "").trim();
  const sentence = cleaned.split(/[。\n]/)[0].trim() || cleaned;
  return sentence.length > 28 ? sentence.slice(0, 28) + "…" : sentence;
}

function boundsKey(){
  let maxX = 0, maxY = 0, count = 0;
  (view && view.nodes || []).forEach(node => {
    count += 1;
    maxX = Math.max(maxX, node.x + (node.radius || 0));
    maxY = Math.max(maxY, node.y + (node.radius || 0));
  });
  return `${count}:${Math.round(maxX)}:${Math.round(maxY)}`;
}

function applyTransform(){
  const transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  document.querySelector("#world").style.transform = transform;
  document.querySelector("#live-layer").style.transform = transform;
  const zoomLevel = document.querySelector("#zoom-level");
  const percentage = `${Math.round(scale * 100)}%`;
  if(zoomLevel.textContent !== percentage) zoomLevel.textContent = percentage;
}

function fit(){
  if(!view || !view.ok || !(view.nodes || []).length) return;
  const canvas = document.querySelector("#canvas");
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  view.nodes.forEach(node => {
    const radius = node.radius || view.radius || 58;
    minX = Math.min(minX, node.x - radius - (node.goal ? 28 : 0));
    minY = Math.min(minY, node.y - radius - (node.goal ? 72 : 0));
    maxX = Math.max(maxX, node.x + radius + (node.goal ? 28 : 0));
    maxY = Math.max(maxY, node.y + radius + (node.goal ? 28 : 0));
  });
  const padX = 40;
  const padTop = 28;
  const padBottom = 72;
  const worldW = Math.max(1, maxX - minX);
  const worldH = Math.max(1, maxY - minY);
  const sx = Math.max(1, canvas.clientWidth - padX * 2) / worldW;
  const sy = Math.max(1, canvas.clientHeight - padTop - padBottom) / worldH;
  scale = Math.max(0.12, Math.min(1.15, Math.min(sx, sy)));
  panX = (canvas.clientWidth - worldW * scale) / 2 - minX * scale;
  panY = padTop + (canvas.clientHeight - padTop - padBottom - worldH * scale) / 2 - minY * scale;
}

function nodeById(id){return (view.nodes || []).find(node => node.id === id)}

function liveKey(source){
  return `${source && source.running}:` + (source && source.nodes || []).map(node => `${node.id}:${node.status || ""}:${node.steps_revision || ""}:${node.step_count ?? ""}:${(node.live || []).map(step => step.label).join("/")}`).join("|");
}

function sizeKey(source){
  return (source && source.nodes || []).map(node => `${node.id}:${node.radius}`).join("|");
}

function structureKey(source){
  return JSON.stringify([source?.ok,source?.message,source?.goal,source?.edges,(source?.nodes || []).map(node => [node.id,node.title,node.x,node.y,node.tone,node.weight,node.status,node.notes,node.agents,node.children])]);
}

function linkedIds(id){
  const ids = new Set([id]);
  (view.edges || []).forEach(edge => {
    if(edge.from === id || edge.to === id){
      ids.add(edge.from);
      ids.add(edge.to);
    }
  });
  return ids;
}

function nodeBounds(){
  let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
  (view.nodes || []).forEach(node => {
    const radius = node.radius || 58;
    minX = Math.min(minX, node.x - radius);
    minY = Math.min(minY, node.y - radius);
    maxX = Math.max(maxX, node.x + radius);
    maxY = Math.max(maxY, node.y + radius);
  });
  return {minX, minY, maxX, maxY};
}

function rememberTip(el, step){
  const label = String((step && step.label) || "").trim();
  const matched = label.match(/^【([^】]+)】(.*)$/);
  const rest = (matched ? matched[2] : label).trim();
  const hint = String((step && step.hint) || "").trim();
  el.dataset.tipAction = matched ? matched[1] : "";
  el.dataset.tip = hint.length > rest.length ? hint : (rest || hint);
  el.removeAttribute("title");
}

function fillLabel(parent, label){
  const matched = String(label || "").match(/^【([^】]+)】(.*)$/);
  parent.textContent = "";
  if(!matched){
    parent.textContent = label;
    return;
  }
  const action = document.createElement("b");
  action.className = "act";
  action.textContent = `【${matched[1]}】`;
  parent.append(action);
  if(matched[2]) parent.append(document.createTextNode(matched[2]));
}

function chipBox(step){
  const label = String(step.label || step.tool || "");
  let text = 0;
  for(const ch of label) text += ch.charCodeAt(0) > 255 ? 13 : 7.1;
  if((step.count || 1) > 1) text += 32;
  const screenW = Math.min(280, Math.max(108, Math.ceil(text + 42)));
  return {w: screenW / scale, h: 26 / scale};
}

function rectHitsCircle(rect, node, pad){
  const radius = (node.radius || 58) + pad;
  const nearestX = Math.max(rect.x, Math.min(node.x, rect.x + rect.w));
  const nearestY = Math.max(rect.y, Math.min(node.y, rect.y + rect.h));
  return Math.hypot(node.x - nearestX, node.y - nearestY) < radius;
}

function rectsOverlap(a, b, pad){
  return a.x < b.x + b.w + pad && a.x + a.w + pad > b.x && a.y < b.y + b.h + pad && a.y + a.h + pad > b.y;
}

function placeChips(node, steps, occupied){
  const boxes = steps.map(chipBox);
  const gap = 8 / scale;
  const rowH = boxes[0].h;
  const radius = node.radius || 58;
  const margin = 16 / scale;
  const canvas = document.querySelector("#canvas");
  const frame = {
    left: (-panX + 12) / scale,
    top: (-panY + 12) / scale,
    right: (canvas.clientWidth - panX - 12) / scale,
    bottom: (canvas.clientHeight - panY - 76) / scale,
  };
  const rowsFit = Math.max(6, Math.floor((frame.bottom - frame.top) * 0.62 / (rowH + gap)));
  let useCols = boxes.length > rowsFit ? Math.ceil(boxes.length / rowsFit) : 1;
  useCols = Math.min(4, Math.max(1, useCols));
  if(useCols > 1){
    const maxW = Math.max(108 / scale, (frame.right - frame.left - gap * (useCols - 1)) / useCols);
    boxes.forEach(box => { box.w = Math.min(box.w, maxW); });
  }
  const colW = Math.max(...boxes.map(box => box.w));
  const rows = Math.ceil(boxes.length / useCols);
  const gridW = useCols * colW + (useCols - 1) * gap;
  const gridH = rows * rowH + (rows - 1) * gap;
  let best = null;
  let bestScore = Infinity;
  const bestCols = useCols;
  function clipped(rect){
    const ox = Math.max(0, frame.left - rect.x) + Math.max(0, rect.x + rect.w - frame.right);
    const oy = Math.max(0, frame.top - rect.y) + Math.max(0, rect.y + rect.h - frame.bottom);
    return ox + oy;
  }
  function consider(x, y){
    const rect = {x, y, w: gridW, h: gridH};
    const dist = Math.hypot(x + gridW / 2 - node.x, y + gridH / 2 - node.y);
    let score = dist + clipped(rect) * 18;
    view.nodes.forEach(other => { if(rectHitsCircle(rect, other, 10 / scale)) score += 8000; });
    (occupied || []).forEach(box => { if(rectsOverlap(rect, box, 8 / scale)) score += 5000; });
    if(score < bestScore){ bestScore = score; best = {x, y}; }
  }
  const slide = rowH + gap;
  const shifts = [0, 1, -1, 2, -2, 3, -3];
  for(let ring = 0; ring < 10; ring++){
    const dist = margin + ring * (22 / scale);
    shifts.forEach(nudge => {
      const shift = nudge * slide * 0.7;
      consider(node.x + radius + dist, node.y - gridH / 2 + shift);
      consider(node.x - radius - dist - gridW, node.y - gridH / 2 + shift);
      consider(node.x - gridW / 2 + shift, node.y - radius - dist - gridH);
      consider(node.x - gridW / 2 + shift, node.y + radius + dist);
    });
  }
  if(!best) best = {x: node.x + radius + margin, y: node.y - gridH / 2};
  const spots = boxes.map((box, index) => {
    const col = index % bestCols;
    const row = Math.floor(index / bestCols);
    return {
      x: best.x + col * (colW + gap),
      y: best.y + row * (rowH + gap),
      w: box.w,
      h: box.h,
    };
  });
  spots.forEach(spot => (occupied || []).push(spot));
  return spots;
}

function placeOne(node, step, occupied){
  const box = chipBox(step);
  const radius = node.radius || 58;
  const gap = 12 / scale;
  const canvas = document.querySelector("#canvas");
  const frame = {
    left: (-panX + 12) / scale,
    top: (-panY + 12) / scale,
    right: (canvas.clientWidth - panX - 12) / scale,
    bottom: (canvas.clientHeight - panY - 76) / scale,
  };
  let best = null;
  let bestDist = Infinity;
  let fallback = null;
  let fallbackScore = Infinity;
  const reach = radius + Math.max(box.w, box.h) + 280;
  for(let ring = 0; ring < 16; ring++){
    const dist = radius + gap + box.h / 2 + ring * (20 / scale);
    if(dist > reach && best) break;
    for(let stepIndex = 0; stepIndex < 16; stepIndex++){
      const angle = -Math.PI / 2 + stepIndex * (Math.PI * 2 / 16) + ring * 0.22;
      const cx = node.x + Math.cos(angle) * dist;
      const cy = node.y + Math.sin(angle) * dist;
      const rect = {x: cx - box.w / 2, y: cy - box.h / 2, w: box.w, h: box.h};
      let nodesHit = 0;
      let chipsHit = 0;
      view.nodes.forEach(other => { if(rectHitsCircle(rect, other, 12 / scale)) nodesHit += 1; });
      (occupied || []).forEach(prev => { if(rectsOverlap(rect, prev, 8 / scale)) chipsHit += 1; });
      const ox = Math.max(0, frame.left - rect.x) + Math.max(0, rect.x + rect.w - frame.right);
      const oy = Math.max(0, frame.top - rect.y) + Math.max(0, rect.y + rect.h - frame.bottom);
      const clip = ox + oy;
      const centerDist = Math.hypot(cx - node.x, cy - node.y);
      if(nodesHit === 0 && chipsHit === 0 && clip < 1 && centerDist < bestDist){
        bestDist = centerDist;
        best = rect;
      }
      const score = centerDist + nodesHit * 8000 + chipsHit * 5000 + clip * 18;
      if(score < fallbackScore){
        fallbackScore = score;
        fallback = rect;
      }
    }
  }
  const spot = best || fallback || {x: node.x + radius + gap, y: node.y - box.h / 2, w: box.w, h: box.h};
  (occupied || []).push(spot);
  return spot;
}

function glidePan(nextX, nextY){
  const token = ++glideToken;
  const fromX = panX;
  const fromY = panY;
  const start = performance.now();
  const duration = 760;
  function frame(now){
    if(token !== glideToken) return;
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    panX = fromX + (nextX - fromX) * eased;
    panY = fromY + (nextY - fromY) * eased;
    applyTransform();
    if(t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function revealChips(node, spots){
  if(!spots.length || revealedFor === node.id) return;
  revealedFor = node.id;
  const canvas = document.querySelector("#canvas");
  const pad = 16;
  const bottomPad = 76;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  spots.forEach(spot => {
    minX = Math.min(minX, spot.x);
    minY = Math.min(minY, spot.y);
    maxX = Math.max(maxX, spot.x + spot.w);
    maxY = Math.max(maxY, spot.y + spot.h);
  });
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  let nextX = panX;
  let nextY = panY;
  const left = nextX + minX * scale;
  const right = nextX + maxX * scale;
  const top = nextY + minY * scale;
  const bottom = nextY + maxY * scale;
  if(right - left <= width - pad * 2){
    if(right > width - pad) nextX -= right - (width - pad);
    if(nextX + minX * scale < pad) nextX += pad - (nextX + minX * scale);
  } else {
    nextX = pad - minX * scale;
  }
  if(bottom - top <= height - pad - bottomPad){
    if(bottom > height - bottomPad) nextY -= bottom - (height - bottomPad);
    if(nextY + minY * scale < pad) nextY += pad - (nextY + minY * scale);
  } else {
    nextY = pad - minY * scale;
  }
  userMoved = true;
  holdScale = true;
  if(Math.hypot(nextX - panX, nextY - panY) < 2) return;
  const token = ++glideToken;
  setTimeout(() => {
    if(token !== glideToken) return;
    glidePan(nextX, nextY);
  }, 180);
}

function toolCount(node){
  const done = node.step_count ?? (node.steps || []).length;
  const live = (node.live || []).filter(step => step.tool && step.tool !== "思考").length;
  return done + live;
}

function awaitingAgent(node){
  return !node.goal && node.status !== "cancelled" && node.status !== "resolved" && !(node.agents && node.agents.length) && toolCount(node) === 0;
}

function goalActivity(source){
  if(!source || !source.ok || source.running !== true) return null;
  const tasks = (source.nodes || []).filter(node => !node.goal);
  if(!tasks.length) return {phase:"planning",label:"拆解问题中"};
  if(tasks.some(node => (node.live || []).length)) return null;
  if(!tasks.every(node => node.status === "resolved" || node.status === "cancelled")) return null;
  return {phase:"finalizing",label:tasks.every(node => node.status === "resolved") ? "整理报告中" : "汇总结果中"};
}

function goalIsWorking(node){
  return Boolean(node.goal && goalActivity(view));
}

function ringAmount(node, calls){
  if(node.status === "cancelled") return 0;
  if(node.goal) return 0;
  if(node.status === "resolved") return 1;
  if(awaitingAgent(node)) return 0.28;
  if(node.status !== "in_progress" && calls <= 0) return 0;
  const grown = Math.min(0.88, 1 - 1 / (1 + calls / 7));
  return node.status === "in_progress" ? Math.max(0.1, grown) : grown;
}

function burstDelay(id, index){
  if(burstId !== id) return -1e9;
  return index * BURST_STEP - (performance.now() - burstAt);
}

const liveChips = new Map();
const liveSpokes = new Map();

function liveIdentity(node, step, nth){
  return [node.id, step.tool || "", step.label || "", String(nth)].join("\u001f");
}

function styleChip(el, spot){
  el.style.left = `${spot.x}px`;
  el.style.top = `${spot.y}px`;
  el.style.width = `${spot.w}px`;
  el.style.height = `${spot.h}px`;
  el.style.padding = `0 ${10 / scale}px`;
  el.style.gap = `${6 / scale}px`;
  el.style.borderRadius = `${spot.h / 2}px`;
  el.style.fontSize = `${12 / scale}px`;
}

function chipAnchor(node, spot){
  const cx = spot.x + spot.w / 2;
  const cy = spot.y + spot.h / 2;
  const horizontal = Math.abs(cx - node.x) >= Math.abs(cy - node.y);
  const x2 = horizontal ? (cx >= node.x ? spot.x : spot.x + spot.w) : cx;
  const y2 = horizontal ? cy : (cy >= node.y ? spot.y : spot.y + spot.h);
  return {x2, y2};
}

function clearLive(){
  liveChips.clear();
  liveSpokes.clear();
  const layer = document.querySelector("#live-layer");
  if(layer) layer.replaceChildren();
}

function retreatChip(el){
  const node = nodeById(el.dataset.node);
  el.classList.remove("burst");
  if(!node){
    el.remove();
    return;
  }
  const x = parseFloat(el.style.left) || node.x;
  const y = parseFloat(el.style.top) || node.y;
  const w = parseFloat(el.style.width) || 0;
  const h = parseFloat(el.style.height) || 0;
  el.style.setProperty("--from-x", `${(node.x - (x + w / 2)).toFixed(1)}px`);
  el.style.setProperty("--from-y", `${(node.y - (y + h / 2)).toFixed(1)}px`);
  el.classList.add("retreat");
  const done = () => el.remove();
  el.addEventListener("animationend", done, {once: true});
  setTimeout(done, 420);
}

function makeLiveChip(node, step, spot){
  const el = document.createElement("button");
  el.type = "button";
  el.className = `satellite live tool-${step.tool} tone-${node.tone || "blue"} burst`;
  el.dataset.node = node.id;
  el.style.setProperty("--from-x", `${(node.x - (spot.x + spot.w / 2)).toFixed(1)}px`);
  el.style.setProperty("--from-y", `${(node.y - (spot.y + spot.h / 2)).toFixed(1)}px`);
  styleChip(el, spot);
  rememberTip(el, step);
  const mark = document.createElement("i");
  mark.className = "mark";
  mark.style.width = mark.style.height = `${6 / scale}px`;
  const text = document.createElement("span");
  fillLabel(text, step.label || TOOL[step.tool] || step.tool);
  el.append(mark, text);
  el.addEventListener("animationend", () => el.classList.remove("burst"), {once: true});
  el.addEventListener("click", event => {
    event.stopPropagation();
    select(node.id, null);
  });
  return el;
}

function liveSpokeSvg(){
  const layer = document.querySelector("#live-layer");
  let svg = layer.querySelector("svg.live-spokes");
  if(svg) return svg;
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "edges live-spokes");
  svg.setAttribute("width", "4000");
  svg.setAttribute("height", "4000");
  layer.prepend(svg);
  return svg;
}

function paintSpoke(line, node, spot, step, radiusOf, emerge){
  const {x2, y2} = chipAnchor(node, spot);
  const dx = x2 - node.x, dy = y2 - node.y, len = Math.hypot(dx, dy) || 1;
  const radius = radiusOf(node);
  line.setAttribute("stroke", MARK[step.tool] || "#9ec9d6");
  line.setAttribute("x1", (node.x + dx / len * radius).toFixed(1));
  line.setAttribute("y1", (node.y + dy / len * radius).toFixed(1));
  line.setAttribute("x2", x2.toFixed(1));
  line.setAttribute("y2", y2.toFixed(1));
  if(emerge) line.setAttribute("class", "spoke burst");
}

function syncLive(items, radiusOf){
  const layer = document.querySelector("#live-layer");
  const svg = liveSpokeSvg();
  const wanted = new Map();
  items.forEach(item => {
    const seen = new Map();
    item.spots.forEach((spot, index) => {
      const step = item.node.live[index];
      const base = `${step.tool}|${step.label}`;
      const nth = seen.get(base) || 0;
      seen.set(base, nth + 1);
      wanted.set(liveIdentity(item.node, step, nth), {node: item.node, step, spot});
    });
  });
  for(const [key, el] of [...liveChips]){
    if(wanted.has(key)) continue;
    liveChips.delete(key);
    retreatChip(el);
    const line = liveSpokes.get(key);
    liveSpokes.delete(key);
    if(!line) continue;
    line.setAttribute("class", "spoke retreat");
    const drop = () => line.remove();
    line.addEventListener("animationend", drop, {once: true});
    setTimeout(drop, 420);
  }
  wanted.forEach((item, key) => {
    const existing = liveChips.get(key);
    if(existing){
      styleChip(existing, item.spot);
      const line = liveSpokes.get(key);
      if(line) paintSpoke(line, item.node, item.spot, item.step, radiusOf, false);
      return;
    }
    const el = makeLiveChip(item.node, item.step, item.spot);
    liveChips.set(key, el);
    layer.appendChild(el);
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    paintSpoke(line, item.node, item.spot, item.step, radiusOf, true);
    svg.appendChild(line);
    liveSpokes.set(key, line);
  });
}

function draw(){
  hideChipTip();
  goalWorkObserver.disconnect();
  const app = document.querySelector(".app");

    if(!userMoved && !holdScale){
      fit();
      fittedKey = boundsKey();
    } else {
      // Preserve the user's camera centre when the detail pane changes size.
      panX += (canvas.clientWidth - previousWidth) / 2;
      panY += (canvas.clientHeight - previousHeight) / 2;
    }
  }
  const animateSelection = selectionTransition && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    drawer.classList.add("focus-in");
  } else if(!selected){

  }

  applyTransform();
  if(!view || !view.ok){

    world.replaceChildren();
    document.querySelector("#empty").hidden = false;
    document.querySelector("#empty-text").textContent = view ? view.message : "";
    document.querySelector("#goal-text").textContent = "这份运行没有星图";

  }
  document.querySelector("#empty").hidden = true;
  document.querySelector("#goal-text").textContent = shortTitle(view.goal.title) || "";
  updateModelTag(view.model);
  const radiusOf = node => node.radius || view.radius || 58;
  let maxX = 0, maxY = 0;
  view.nodes.forEach(node => {
    const radius = radiusOf(node);
    maxX = Math.max(maxX, node.x + radius);
    maxY = Math.max(maxY, node.y + radius);
  });
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "edges graph-edges");
  svg.setAttribute("width", String(maxX + 140));
  svg.setAttribute("height", String(maxY + 140));
  const bends = {parent: 36, audit: -78, support: 58, challenge: -64, error: -96};
  const shownRelation = edge => edge.relation === "fusion" ? "audit" : edge.relation;
  const parentCount = {};
  const sameTarget = {};
  (view.edges || []).forEach(edge => {
    const relation = shownRelation(edge);
    if(relation === "parent") parentCount[edge.from] = (parentCount[edge.from] || 0) + 1;
    const key = `${relation}:${edge.to}`;
    sameTarget[key] = (sameTarget[key] || 0) + 1;
  });
  (view.edges || []).forEach((edge, index) => {
    const from = nodeById(edge.from), to = nodeById(edge.to);
    if(!from || !to) return;
    const dx = to.x - from.x, dy = to.y - from.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const x1 = from.x + ux * radiusOf(from), y1 = from.y + uy * radiusOf(from);
    const x2 = to.x - ux * radiusOf(to), y2 = to.y - uy * radiusOf(to);
    const relation = shownRelation(edge);
    const bend = (bends[relation] || 40) + (index % 4) * 10;
    const mx = (x1 + x2) / 2 - uy * bend;
    const my = (y1 + y2) / 2 + ux * bend;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const hot = !selected || edge.from === selected || edge.to === selected;
    path.dataset.from = edge.from;
    path.dataset.to = edge.to;
    path.setAttribute("class", `edge ${relation}${hot ? "" : " dim"}`);
    path.setAttribute("d", `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    svg.appendChild(path);
    if(animateSelection && hot){
      const trace = path.cloneNode();
      trace.setAttribute("class", `edge ${relation} focus-trace`);
      trace.removeAttribute("data-from");
      trace.removeAttribute("data-to");
      trace.setAttribute("pathLength", "1");
      svg.appendChild(trace);
    }
    const crowded = (relation === "parent" && parentCount[edge.from] > 3) || sameTarget[`${relation}:${edge.to}`] > 4;
    if(crowded) return;
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.dataset.from = edge.from;
    label.dataset.to = edge.to;

    label.setAttribute("x", mx.toFixed(1));
    label.setAttribute("y", (my - 6).toFixed(1));
    label.setAttribute("text-anchor", "middle");
    label.textContent = REL[relation] || relation;
    svg.appendChild(label);
  });
  const focus = selected ? nodeById(selected) : null;
  const occupied = [];
  const spots = focus && focus.steps && focus.steps.length ? placeChips(focus, focus.steps, occupied) : [];
  if(focus && spots.length) revealChips(focus, spots);
  applyTransform();
  const arrive = Boolean(selected && selected !== chipHost);
  if(arrive){
    burstId = selected;

  }

  else chipHost = null;
  const liveNodes = (view.nodes || []).filter(node => node.live && node.live.length && node.id !== selected);

  const chipKey = JSON.stringify([focus?.id,focus?.steps_revision || focus?.steps,activeStep,scale,spots]);
  const chipsChanged = world.dataset.chipKey !== chipKey;
  world.dataset.chipKey = chipKey;
  if(chipsChanged) world.querySelectorAll("button.satellite,svg.focus-spokes").forEach(el => el.remove());
  const focusSpokes = document.createElementNS("http://www.w3.org/2000/svg", "svg");

  focusSpokes.setAttribute("width", String(maxX + 140));
  focusSpokes.setAttribute("height", String(maxY + 140));
  if(chipsChanged && spots.length){
    const gridLeft = Math.min(...spots.map(spot => spot.x));
    const gridRight = Math.max(...spots.map(spot => spot.x + spot.w));
    const gridTop = Math.min(...spots.map(spot => spot.y));
    const gridBottom = Math.max(...spots.map(spot => spot.y + spot.h));
    const horizontal = Math.abs((gridLeft + gridRight) / 2 - focus.x) >= Math.abs((gridTop + gridBottom) / 2 - focus.y);
    spots.forEach((spot, index) => {
      const step = focus.steps[index];
      const onInner = horizontal
        ? ((gridLeft + gridRight) / 2 >= focus.x ? Math.abs(spot.x - gridLeft) < 2 : Math.abs(spot.x + spot.w - gridRight) < 2)
        : ((gridTop + gridBottom) / 2 >= focus.y ? Math.abs(spot.y - gridTop) < 2 : Math.abs(spot.y + spot.h - gridBottom) < 2);
      if(!onInner) return;
      const x2 = horizontal ? ((gridLeft + gridRight) / 2 >= focus.x ? spot.x : spot.x + spot.w) : spot.x + spot.w / 2;
      const y2 = horizontal ? spot.y + spot.h / 2 : ((gridTop + gridBottom) / 2 >= focus.y ? spot.y : spot.y + spot.h);
      const dx = x2 - focus.x, dy = y2 - focus.y, len = Math.hypot(dx, dy) || 1;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

      line.setAttribute("stroke", MARK[step.tool] || "#9ec9d6");
      line.setAttribute("x1", (focus.x + dx / len * radiusOf(focus)).toFixed(1));
      line.setAttribute("y1", (focus.y + dy / len * radiusOf(focus)).toFixed(1));
      line.setAttribute("x2", x2.toFixed(1));
      line.setAttribute("y2", y2.toFixed(1));
      focusSpokes.appendChild(line);
    });
  }
  const edgeKey = JSON.stringify([view.edges,view.nodes.map(node => [node.id,node.x,node.y,radiusOf(node)])]);
  if(oldEdges && oldEdges.dataset.geometry === edgeKey){
    oldEdges.querySelectorAll(".focus-trace").forEach(el => el.remove());

    if(oldEdges) oldEdges.replaceWith(svg);
    else world.prepend(svg);
  }
  if(chipsChanged && spots.length) world.appendChild(focusSpokes);
  const linked = selected ? linkedIds(selected) : null;
  const taskNodes = view.nodes.filter(node => !node.goal);
  const resolvedCount = taskNodes.filter(node => node.status === "resolved").length;

    const finalizing = node.goal && mainActivity && mainActivity.phase === "finalizing";
    const erroneous = (view.edges || []).some(edge => edge.relation === "error" && edge.to === node.id);
    el.className = `node tone-${tone} weight-${node.weight || "node"}${nodeRadius < 72 && !node.goal ? " compact" : ""}${node.status === "in_progress" ? " in_progress" : ""}${pending ? " pending" : ""}${working ? " working" : ""}${finalizing ? " finalizing" : ""}${erroneous ? " erroneous" : ""}${fresh ? " arrive" : ""}${previousTone && previousTone !== tone ? " tone-arrive" : ""}${node.status === "cancelled" ? " cancelled" : ""}${selected === node.id ? " selected" : ""}${dim ? " dim" : ""}${animateSelection && selected === node.id ? " focus-in" : ""}${animateSelection && dim ? " focus-away" : ""}`;
    el.style.left = `${node.x - nodeRadius}px`;
    el.style.top = `${node.y - nodeRadius}px`;
    el.style.width = `${nodeRadius * 2}px`;
    el.style.height = `${nodeRadius * 2}px`;
    el.style.setProperty("--node-font", `${node.goal ? Math.min(16,Math.max(12.5,nodeRadius * .12)) : Math.min(14,Math.max(12,nodeRadius * .14))}px`);
    el.dataset.id = node.id;
    el.dataset.status = node.status || "";
    el.dataset.tip = node.title || "";
    el.dataset.tipAction = "";
    el.removeAttribute("title");
    const calls = toolCount(node);
    const stateText = node.goal ? (mainActivity ? mainActivity.label : view.running ? "调研中" : "已结束") : erroneous ? "存在错误" : pending ? "待分配" : (STATUS[node.status] || "研究任务");
    const signature = JSON.stringify([node.id,node.x,node.y,nodeRadius,node.tone,node.weight,node.title,node.status,calls,stateText,working,erroneous,(node.children || []).length,node.goal ? [resolvedCount,taskNodes.length,agentCount,mainActivity] : null]);
    const previousNode = previousNodes.get(node.id);
    previousNodes.delete(node.id);
    if(previousNode && previousNode.dataset.signature === signature){
      previousNode.classList.toggle("selected",selected === node.id);
      previousNode.classList.toggle("dim",Boolean(dim));
      previousNode.classList.toggle("focus-in",Boolean(animateSelection && selected === node.id));
      previousNode.classList.toggle("focus-away",Boolean(animateSelection && dim));
      if(working) goalWorkObserver.observe(previousNode);
      return;
    }
    el.dataset.signature = signature;
    const content = document.createElement("span");
    content.className = "node-content";
    const category = document.createElement("span");
    category.className = "node-kicker";
    category.textContent = node.goal ? "研究主问题" : "研究任务";
    const title = document.createElement("b");
    title.className = "node-title";
    title.textContent = node.title;
    content.append(category,title);
    if(node.goal){
      const summary = document.createElement("small");
      summary.className = "node-summary";
      summary.textContent = taskNodes.length ? `已完成 ${resolvedCount} / ${taskNodes.length} 项任务` : (view.running ? "正在拆解研究问题" : "尚无子任务");
      content.appendChild(summary);
    }
    const meta = document.createElement("small");
    meta.className = "node-meta";
    meta.textContent = node.goal ? (finalizing ? mainActivity.label : agentCount ? `${agentCount} 个研究智能体` : "等待任务分配") : `${calls} 次工具调用${node.children && node.children.length ? ` · ${node.children.length} 项子任务` : ""}`;
    content.appendChild(meta);
    const tab = document.createElement("span");
    tab.className = "node-tab";
    tab.textContent = stateText;
    tab.setAttribute("aria-hidden", "true");
    const identifier = document.createElement("span");
    identifier.className = "node-id";
    identifier.textContent = node.goal ? "Q" : String(node.id).toUpperCase();
    identifier.setAttribute("aria-hidden", "true");
    el.append(content,tab,identifier);
    if(working){
      const orbit = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      orbit.setAttribute("class", "goal-work-orbit");
      orbit.setAttribute("viewBox", "0 0 100 100");
      orbit.setAttribute("aria-hidden", "true");
      orbit.innerHTML = '<circle class="goal-work-track" cx="50" cy="50" r="47"/><g class="goal-work-sweep"><circle cx="50" cy="50" r="47" pathLength="100" transform="rotate(-90 50 50)"/><circle class="echo" cx="50" cy="50" r="47" pathLength="100" transform="rotate(90 50 50)"/><circle class="goal-work-spark" cx="94" cy="33" r="1.65"/></g>';
      el.appendChild(orbit);
    }
    el.setAttribute("aria-label", `${node.title}，${stateText}，${node.goal ? `${resolvedCount} 项任务已完成，共 ${taskNodes.length} 项` : `${calls} 次工具调用`}`);
    const amount = ringAmount(node, calls);
    if(amount > 0){
      const pad = 8;
      const stroke = 2.8;
      const size = nodeRadius * 2 + pad * 2;
      const radius = nodeRadius + pad - stroke;
      const center = size / 2;
      const circ = 2 * Math.PI * radius;
      const previous = !entryPreview && haloSeen.has(node.id) ? haloSeen.get(node.id) : amount;
      haloSeen.set(node.id, amount);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "halo");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
      svg.style.left = `${-pad}px`;
      svg.style.top = `${-pad}px`;
      const track = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      track.setAttribute("class", "track");
      track.setAttribute("cx", center);
      track.setAttribute("cy", center);
      track.setAttribute("r", radius);
      const arc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      arc.setAttribute("class", "arc");
      arc.setAttribute("cx", center);
      arc.setAttribute("cy", center);
      arc.setAttribute("r", radius);
      arc.setAttribute("transform", `rotate(-90 ${center} ${center})`);
      arc.dataset.circ = circ.toFixed(2);
      const paint = value => {
        if(value >= 1){
          arc.style.strokeDasharray = "none";
          arc.style.strokeLinecap = "butt";
          return;
        }
        arc.style.strokeLinecap = "round";
        arc.style.strokeDasharray = `${(value * circ).toFixed(2)} ${circ.toFixed(2)}`;
      };
      paint(previous);
      svg.append(track, arc);
      el.appendChild(svg);
      if(Math.abs(previous - amount) > 0.004){
        requestAnimationFrame(() => {
          arc.style.transition = "stroke-dasharray .7s ease";
          paint(amount);
        });
      }
    }
    if(nodeRadius < 72 && node.status){
      const pip = document.createElement("i");

      el.appendChild(pip);
    }
    el.addEventListener("click", event => {
      event.stopPropagation();
      select(node.id, null);
    });
    if(previousNode) previousNode.replaceWith(el);
    else world.appendChild(el);
    if(working) goalWorkObserver.observe(el);
  });
  previousNodes.forEach(el => el.remove());
  (chipsChanged ? spots : []).forEach((spot, index) => {
    const step = focus.steps[index];

      el.style.setProperty("--from-y", `${(focus.y - (spot.y + spot.h / 2)).toFixed(1)}px`);
      el.style.animationDelay = `${delay}ms`;
    }
    el.style.left = `${spot.x}px`;
    el.style.top = `${spot.y}px`;
    el.style.width = `${spot.w}px`;
    el.style.height = `${spot.h}px`;
    el.style.padding = `0 ${10 / scale}px`;
    el.style.gap = `${6 / scale}px`;
    el.style.borderRadius = `${spot.h / 2}px`;
    el.style.fontSize = `${12 / scale}px`;
    rememberTip(el, step);
    const mark = document.createElement("i");
    mark.className = "mark";
    mark.style.width = mark.style.height = `${6 / scale}px`;
      const text = document.createElement("span");
      fillLabel(text, step.label || TOOL[step.tool] || step.tool);
      el.append(mark, text);
      if((step.count || 1) > 1){
      const times = document.createElement("em");
      times.textContent = `×${step.count}`;
      times.style.fontSize = `${11 / scale}px`;
      el.append(times);
    }
    el.addEventListener("click", event => {
      event.stopPropagation();
      select(focus.id, index);
    });
    world.appendChild(el);
  });
  syncLive(livePlaced, radiusOf);
  resumeChipTip();
}

function childState(node){
  if(!node) return {state:"pending",label:"准备中"};
  if(node.status === "resolved") return {state:"resolved",label:"已完成"};
  if(node.status === "cancelled") return {state:"cancelled",label:"已取消"};
  if(awaitingAgent(node)) return {state:"pending",label:view && view.running === false ? "待开始" : "准备中"};
  if(node.status === "in_progress" || (node.live || []).length){
    return view && view.running === false ? {state:"cancelled",label:"已停止"} : {state:"working",label:"工作中"};
  }
  return {state:"pending",label:view && view.running === false ? "待开始" : "准备中"};
}

function renderChildren(node){
  const host = document.querySelector("#children");
  const entries = (node.children || []).map(child => {
    const match = nodeById(child.id);
    return {id:child.id,title:child.title || "未命名任务",tone:(match && match.tone) || "pending",...childState(match)};
  });
  const signature = JSON.stringify([node.id,entries]);
  if(host.dataset.signature === signature) return;
  host.dataset.signature = signature;
  host.replaceChildren();
  if(!entries.length){
    host.textContent = "没有子任务";
    return;
  }
  entries.forEach((child,index) => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = `child tone-${child.tone} state-${child.state}`;
    row.style.setProperty("--child-delay", `${-index * .37}s`);
    row.setAttribute("aria-label", `${child.title}，${child.label}`);
    const icon = document.createElement("span");
    icon.className = "child-icon";
    icon.setAttribute("aria-hidden", "true");
    if(child.state === "resolved") icon.innerHTML = '<svg viewBox="0 0 16 16"><path d="m4 8 2.5 2.5L12 5"/></svg>';
    else if(child.state === "cancelled") icon.innerHTML = '<svg viewBox="0 0 16 16"><path d="M5 8h6"/></svg>';
    const copy = document.createElement("span");
    copy.className = "child-copy";
    const title = document.createElement("span");
    title.className = "child-title";
    title.textContent = child.title;
    const status = document.createElement("small");
    status.className = "child-status";
    status.textContent = child.label;
    copy.append(title,status);
    row.append(icon,copy);
    row.addEventListener("click", () => select(child.id,null));
    host.appendChild(row);
  });
}
