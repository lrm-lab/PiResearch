<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PiResearch</title>
<style>
:root{--text:#f4f4f5;--muted:#8a8a8a;--line:#242424;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:var(--sans)}
body{background:#000 radial-gradient(#1c1c1c 1px,transparent 1px);background-size:22px 22px}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{display:flex;align-items:center;height:64px;padding:0 28px}
.brand{color:#f4f4f5;text-decoration:none;font-family:"Savoye LET","Snell Roundhand","Segoe Script","Bradley Hand",cursive;font-size:36px;font-weight:400;line-height:1;letter-spacing:.01em}
.brand:hover{color:#fff}
.page{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:28px 0 80px}
@property --sheen{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes sheen{to{--sheen:360deg}}
.ask{width:min(760px,100%);margin:18px auto 8px}
.composer{position:relative;padding:1.5px;border-radius:22px;background:#2a2a2a}
.composer:focus-within{background:conic-gradient(from var(--sheen),#5ce1ff,#6d9cff,#c084fc,#ff6eb4,#ffd36a,#7dffb3,#5ce1ff);box-shadow:0 0 28px #6d9cff66,0 0 56px #ff6eb433;animation:sheen 2.8s linear infinite}
.composer.launching{animation:launch-border .46s ease-out both}
@keyframes launch-border{0%{box-shadow:0 0 28px #6d9cff66,0 0 56px #ff6eb433}55%{box-shadow:0 0 12px #6d9cff44}100%{box-shadow:0 0 0 transparent;background:#2a2a2a}}
.launch-spark{position:absolute;z-index:2;width:5px;height:5px;border-radius:50%;background:var(--spark-color,#8fe9ff);box-shadow:0 0 10px currentColor;pointer-events:none;animation:spark-gather .42s cubic-bezier(.45,0,.16,1) forwards}
@keyframes spark-gather{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) scale(.3)}}
textarea{display:block;width:100%;min-height:124px;margin:0;padding:18px 64px 54px 18px;border:0;border-radius:20px;background:#141414;color:#f5f5f5;line-height:1.55;resize:vertical}
.composer:focus-within textarea{background:#262626}
textarea::placeholder{color:#6e6e6e}
textarea:focus{outline:none}
.launch{position:absolute;right:12px;bottom:12px;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid #3a3a3a;border-radius:50%;background:#1c1c1c;color:#fff}
.composer.launching .launch{z-index:3;opacity:1;animation:launch-ignite .46s ease-out both}
@keyframes launch-ignite{0%,45%{transform:scale(1)}72%{transform:scale(1.16);background:#f4f4f5;color:#111;box-shadow:0 0 0 9px #7ee0ef22,0 0 28px #7ee0ef88}100%{transform:scale(1);background:#f4f4f5;color:#111;box-shadow:0 0 0 18px transparent}}
.launch svg{width:22px;height:22px;overflow:visible}
.launch .flame{fill:#ff8a2a;opacity:0;transform-origin:16px 26px}
.launch:hover,.launch:focus-visible{background:#f4f4f5;color:#111;border-color:#fff;box-shadow:0 0 0 6px #ffffff14,0 12px 28px #ff7a1a66}
.launch:hover .flame,.launch:focus-visible .flame{opacity:1}
.launch:hover svg,.launch:focus-visible svg{transform:translateY(-2px)}
.launch:disabled{opacity:.45;cursor:default;box-shadow:none}
.launch:focus-visible{outline:2px solid #fff;outline-offset:3px}
.top{justify-content:space-between}
.mm{display:inline-flex;flex:none;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px}
.mm svg{display:block;width:64%;height:64%}
.mm-xs{width:14px;height:14px;border-radius:4px}
.mm-lg{width:44px;height:44px;border-radius:13px}
.mm-deepseek{background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.mm-gpt-6\.1-sol{background:#fff;color:#101319;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.settings{position:relative}
.gear{position:relative;display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid #2a2a2a;border-radius:50%;background:#101010;color:#a3a3a3;transition:color .16s,border-color .16s,background .16s}
.gear:hover,.gear[aria-expanded="true"]{color:#fff;border-color:#444;background:#1a1a1a}
.gear:focus-visible{outline:2px solid #8b7cf6;outline-offset:3px}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.gear[aria-expanded="true"] svg{transform:rotate(60deg)}
.gear-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#8b7cf6;box-shadow:0 0 0 2px #000,0 0 10px #8b7cf6aa;animation:dot-in .3s cubic-bezier(.34,1.56,.64,1)}
.gear-dot[hidden]{display:none}
@keyframes dot-in{from{transform:scale(0)}}
.panel{position:absolute;top:calc(100% + 10px);right:0;z-index:20;width:min(352px,calc(100vw - 28px));padding:14px;border:1px solid #333;border-radius:18px;background:radial-gradient(circle at 100% 0%,#231f2e 0%,#151517 46%,#111113 100%);box-shadow:0 24px 70px rgba(0,0,0,.7);transform-origin:100% 0;animation:panel-in .22s cubic-bezier(.16,1,.3,1)}
.panel[hidden]{display:none}
@keyframes panel-in{from{opacity:0;transform:translateY(-6px) scale(.96)}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px 14px;border:1px solid #333;border-radius:14px;background:#1a1a1d;color:#d8d8dc;font-size:14px;font-weight:600;transition:border-color .18s,background .18s,transform .18s}
.mcard:hover{background:#212125;border-color:#4a4a52}
.mcard:focus-visible{outline:2px solid #8b7cf6;outline-offset:2px}
.mcard[aria-checked="true"]{border-color:#8b7cf6;background:#201d2e;box-shadow:0 0 0 1px #8b7cf6,0 0 24px #8b7cf633;color:#fff}
.mcard .mm-lg svg{width:62%;height:62%}
.mcard.bounce .mm{animation:mark-bounce .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes mark-bounce{0%{transform:scale(1)}30%{transform:scale(.82) rotate(-6deg)}70%{transform:scale(1.14) rotate(3deg)}100%{transform:none}}
.mname{display:flex;align-items:center;gap:6px}
.pill{padding:1px 6px;border-radius:999px;background:#2b2b30;color:#9a9aa3;font-size:10px;font-weight:500;line-height:16px}
.mcheck{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#8b7cf6;color:#fff;transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.mcheck svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mcard[aria-checked="true"] .mcheck{transform:scale(1)}
.preview{margin-top:12px;padding:10px;border-radius:12px;background:#0c0c0e}
.pv-box{padding:12px 12px 10px;border:1px solid #2a2a2e;border-radius:10px;background:#18181b}
.pv-line{display:block;height:6px;margin-bottom:7px;border-radius:3px;background:#2e2e34}
.pv-bar{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.pv-send{width:34px;height:16px;border-radius:999px;background:#8b7cf6}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 7px 0 5px;border:1px solid #333;border-radius:9px;background:#1b1b1b;color:#c8c8cc;font-size:12px;font-weight:600;white-space:nowrap;transition:background .16s,border-color .16s,color .16s}
.chip .mm{width:18px;height:18px;border-radius:5px}
.chip.swap .mm{animation:chip-swap .42s cubic-bezier(.34,1.56,.64,1)}
.chip.swap::after{content:"";position:absolute;inset:-3px;border-radius:12px;box-shadow:0 0 0 2px #8b7cf6;opacity:0;pointer-events:none;animation:chip-ring .6s ease-out}
@keyframes chip-swap{from{transform:scale(.4) rotate(-40deg);opacity:0}}
@keyframes chip-ring{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.12)}}
.chip svg.chev{width:12px;height:12px;fill:none;stroke:#7a7a82;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.chip[aria-expanded="true"] svg.chev{transform:rotate(180deg)}
button.chip:hover,button.chip[aria-expanded="true"]{background:#262628;border-color:#4a4a4e;color:#fff}
button.chip:focus-visible{outline:2px solid #8b7cf6;outline-offset:2px}
.model-pick{position:absolute;left:12px;bottom:12px;z-index:2}
.pick-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:15;width:188px;padding:5px;border:1px solid #333;border-radius:12px;background:#171719;box-shadow:0 18px 50px rgba(0,0,0,.7);animation:panel-in .18s cubic-bezier(.16,1,.3,1);transform-origin:0 0}
.pick-menu[hidden]{display:none}
.pick-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:transparent;color:#d0d0d4;font-size:13px;font-weight:550;text-align:left}
.pick-menu button:hover,.pick-menu button:focus-visible{background:#26262a;color:#fff;outline:none}
.pick-menu .grow{flex:1}
.pick-menu svg.ok{width:14px;height:14px;fill:none;stroke:#8b7cf6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mtag{position:absolute;top:9px;left:10px;z-index:4;display:inline-flex;align-items:center;gap:5px;padding:2px 7px 2px 3px;border-radius:999px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.72);font-size:11px;font-weight:560;line-height:14px;pointer-events:none}
.thumb-frame.live .mtag{left:26px}
.thumb .mtag .mm svg{flex:none;width:64%;height:64%}
@media(prefers-reduced-motion:reduce){.panel,.pick-menu,.gear-dot,.mcard.bounce .mm,.chip.swap .mm,.chip.swap::after{animation:none}.gear svg,.mcheck{transition:none}}
.ask-error{min-height:22px;margin:10px 4px 0;color:#ffb4b8;font-size:13px}
.ask-error[hidden]{display:none}
.group{margin-top:36px}
.group h2{margin:0 0 14px;color:#a3a3a3;font-size:13px;font-weight:600;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 16px}
.card{position:relative;min-width:0}
.card-link{display:block;color:inherit;text-decoration:none}
.thumb-frame{position:relative;display:block}
.forget{position:absolute;top:8px;right:8px;z-index:6;display:grid;place-items:center;width:22px;height:22px;margin:0;padding:0;border:0;border-radius:6px;background:rgba(12,12,12,.55);color:#ff4d4d;cursor:pointer;opacity:0;pointer-events:none}
.forget svg{display:block;width:13px;height:13px}
.card:hover .forget,.card:focus-within .forget{opacity:1;pointer-events:auto}
.forget:hover,.forget:focus-visible{color:#ff2a2a;background:rgba(48,10,10,.82)}
@media(hover:none){.forget{opacity:1;pointer-events:auto}}
.thumb-frame.live{position:relative;padding:2px;border-radius:16px;background:#1a1a1a;overflow:hidden}
.thumb-frame.live::before{content:"";position:absolute;left:-60%;top:-90%;z-index:0;width:220%;height:280%;background:conic-gradient(from 0deg,transparent 0deg,transparent 250deg,#7ee0ef55 300deg,#7ee0ef 332deg,#fff 356deg,transparent 360deg);animation:orbit 2.4s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.thumb{position:relative;z-index:1;display:flex;flex-direction:column;aspect-ratio:3/2;overflow:hidden;border:1px solid #1e1e1e;border-radius:16px;background:radial-gradient(ellipse at 50% 40%,#121212 0%,#050505 70%,#000 100%)}
.thumb svg{display:block;flex:1 1 auto;min-height:0;width:100%;height:0}
.thumb-frame.live .thumb{border-color:transparent}
.caption{position:relative;z-index:3;flex:none;padding:16px 14px 12px;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.78) 58%,rgba(0,0,0,0) 100%);pointer-events:none}
.live-dot{position:absolute;top:10px;left:10px;z-index:4;width:8px;height:8px;border-radius:50%;background:#7ee0ef;box-shadow:0 0 0 0 #7ee0ef88;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.card b{display:block;margin:0;overflow:hidden;color:#fff;font-size:15px;font-weight:620;line-height:1.35;white-space:nowrap;text-overflow:ellipsis}
.card small{display:block;margin:0 0 4px;color:rgba(255,255,255,.68);font-size:12px;font-weight:500;line-height:1.3}
/* The destination is rendered at its final viewport size before shared-node motion. */
.zoom-shade{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.12);pointer-events:auto}
.zoom-ghost{position:fixed;z-index:41;margin:0;overflow:hidden;border:0;outline:0;border-radius:16px;box-shadow:none;background:rgba(18,18,20,.28);pointer-events:none}
.zoom-ghost svg{display:block;width:100%}
.zoom-frost{position:absolute;inset:0;pointer-events:none;opacity:1;background:rgba(242,244,248,.09);backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15)}
.study-scene{position:fixed;inset:0;z-index:42;width:100%;height:100%;border:0;background:#000;opacity:0;pointer-events:none}
body.is-zooming{overflow:hidden}
body.is-zooming *{animation-play-state:paused!important}
#running .card:hover .thumb{border-color:#3a3a3a}
#running .card:hover .thumb-frame.live .thumb{border-color:transparent}
#done .thumb-frame{position:relative}
#done .card:hover .thumb-frame{padding:1.5px;margin:-1.5px;border-radius:16px;background:conic-gradient(from var(--sheen),#5ce1ff,#6d9cff,#c084fc,#ff6eb4,#ffd36a,#7dffb3,#5ce1ff);animation:sheen 2.8s linear infinite}
#done .card:hover .thumb{border-color:transparent;box-shadow:0 0 18px #6d9cff66,0 0 32px #ff6eb444}
.empty-note{margin:0;color:#6e6e6e;font-size:13px}
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.veil[hidden]{display:none}
.confirm{position:relative;width:min(430px,100%);max-height:min(600px,calc(100dvh - 40px));overflow:auto;padding:28px;border:1px solid #393939;border-radius:20px;background:radial-gradient(circle at 100% 0%,#29202a 0%,#171719 42%,#111113 100%);box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 45px rgba(172,93,153,.12);animation:confirm-in .24s cubic-bezier(.16,1,.3,1)}
.confirm::before{content:"";position:absolute;inset:0 30px auto;height:1px;background:linear-gradient(90deg,transparent,#6d9cff,#c084fc,#ff6eb4,transparent);opacity:.8}
@keyframes confirm-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.confirm .symbol{display:grid;place-items:center;width:42px;height:42px;margin-bottom:20px;border:1px solid #754146;border-radius:13px;background:#3a2025;color:#ff9a9f}
.confirm .symbol svg{display:block;width:21px;height:21px}
.confirm h2{margin:0;color:#f4f4f5;font-size:21px;font-weight:620;letter-spacing:-.02em;line-height:1.3}
.confirm .note{margin:9px 0 0;color:#bcb8c0;font-size:14px;line-height:1.6}
.confirm .selection{margin-top:23px;padding:14px 16px;border:1px solid #333136;border-radius:12px;background:#1d1b20}
.confirm .selection-label{display:block;margin-bottom:7px;color:#a9a4ae;font-size:12px;line-height:1.3}
.confirm .which{margin:0;max-height:5.4em;overflow:auto;overflow-wrap:anywhere;color:#f4f4f5;font-size:15px;font-weight:560;line-height:1.5}
.confirm .error{margin:14px 0 0;color:#ffb4b8;font-size:13px;line-height:1.5}
.confirm .error[hidden]{display:none}
.confirm .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}
.confirm button{min-height:42px;border:1px solid transparent;border-radius:10px;padding:9px 17px;font-size:14px;font-weight:570}
.confirm .stay{border-color:#404044;background:#252528;color:#e2e1e4}
.confirm .stay:hover,.confirm .stay:focus-visible{background:#343438}
.confirm .yes{background:#a73542;color:#fff}
.confirm .yes:hover,.confirm .yes:focus-visible{background:#bf414f}
.confirm button:disabled,.confirm button[aria-disabled="true"]{opacity:.6;cursor:wait}
.confirm button:focus-visible{outline:2px solid #fff;outline-offset:2px}
body.confirm-open{overflow:hidden}
@media(prefers-reduced-motion:reduce){.confirm{animation:none}}
@media(prefers-reduced-motion:reduce){.composer.launching,.composer.launching .launch,.launch-spark{animation:none}.launch-spark{display:none}}
.group.is-empty h2{margin-bottom:8px}
::selection{background:#333;color:#fff}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){
  .top{padding:0 14px}
  .page{width:calc(100% - 28px);padding-top:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
}
@media(max-width:460px){.grid{grid-template-columns:1fr}.confirm{padding:24px}.confirm .actions{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" title="回到主页">PiResearch</a>
  <div class="settings" id="settings">
    <button type="button" class="gear" id="gear" aria-label="研究模型" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.36 9.31 L20.89 9.63 L20.89 14.37 L18.36 14.69 L18.39 14.59 L19.96 16.61 L16.61 19.96 L14.59 18.39 L14.69 18.36 L14.37 20.89 L9.63 20.89 L9.31 18.36 L9.41 18.39 L7.39 19.96 L4.04 16.61 L5.61 14.59 L5.64 14.69 L3.11 14.37 L3.11 9.63 L5.64 9.31 L5.61 9.41 L4.04 7.39 L7.39 4.04 L9.41 5.61 L9.31 5.64 L9.63 3.11 L14.37 3.11 L14.69 5.64 L14.59 5.61 L16.61 4.04 L19.96 7.39 L18.39 9.41Z"/><circle cx="12" cy="12" r="3"/></svg>
      <i class="gear-dot" id="gear-dot" hidden></i>
    </button>
    <div class="panel" id="settings-panel" role="dialog" aria-label="研究模型" hidden>
      <div class="cards" id="model-cards" role="radiogroup" aria-label="研究模型"></div>
      <div class="preview" aria-hidden="true">
        <div class="pv-box">
          <i class="pv-line" style="width:82%"></i><i class="pv-line" style="width:54%"></i>
          <div class="pv-bar"><span class="chip pv-chip" id="pv-chip"></span><i class="pv-send"></i></div>
        </div>
      </div>
    </div>
  </div>
</header>
<main class="page">
  <form class="ask" id="ask">
    <div class="composer">
      <textarea id="question" name="question" required maxlength="8000" aria-label="研究问题" placeholder="写下要查清的问题。可以包含范围、时间和必须回答的要点。"></textarea>
      <div class="model-pick" id="model-pick">
        <button type="button" class="chip" id="model-chip" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu" aria-label="研究模型"></button>
        <div class="pick-menu" id="model-menu" role="menu" aria-label="研究模型" hidden></div>
      </div>
      <button class="launch" type="submit" aria-label="开始研究">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="flame" d="M12 17.2c1.15 1.35 1.25 2.7 0 4.3-1.25-1.6-1.15-2.95 0-4.3z"/>
          <path fill="currentColor" d="M12 1.6c2.15 2.7 3.15 5.5 3.15 8.7V15.2h-6.3V10.3c0-3.2 1-6 3.15-8.7z"/>
          <path fill="currentColor" d="M8.85 10.6 5.4 15.2h3.45zm6.3 0 3.45 4.6h-3.45z"/>
          <circle cx="12" cy="8.4" r="1.05" fill="#141414"/>
        </svg>
      </button>
    </div>
    <p class="ask-error" id="ask-error" hidden></p>
  </form>
  <section class="group" id="running-group">
    <h2>调研中</h2>
    <div class="grid" id="running"></div>
  </section>
  <section class="group" id="done-group">
    <h2>已完成</h2>
    <div class="grid" id="done"></div>
  </section>
</main>
<div class="veil" id="forget-veil" hidden>
  <div class="confirm" role="dialog" aria-modal="true" aria-labelledby="forget-title" aria-describedby="forget-note">
    <span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 6.5h15M9 6.5V4.7c0-.7.6-1.2 1.3-1.2h3.4c.7 0 1.3.5 1.3 1.2v1.8m-8.9 0 .8 12.1c.1 1 .8 1.7 1.8 1.7h6.6c1 0 1.7-.7 1.8-1.7l.8-12.1M10 10v6.5m4-6.5v6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h2 id="forget-title">确认删除这项研究？</h2>
    <p class="note" id="forget-note"></p>
    <div class="selection"><span class="selection-label">将删除</span><p class="which" id="forget-which"></p></div>

<script>
/* ---- research model choice (shared with Prism and Galaxy through localStorage) ---- */

const MODELS = [{id:"deepseek",name:"DeepSeek",short:"DeepSeek"},{id:"gpt-6.1-sol",name:"GPT-6.1 Sol",short:"GPT-6.1"}];
const GLYPH = {

};
const CHEVRON = '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>';
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>';
function modelOf(id){ return MODELS.find(model => model.id === id) || null; }
function markHtml(id, size){ return `<i class="mm mm-${size} mm-${id}" aria-hidden="true">${GLYPH[id]}</i>`; }
function readModel(){
  try{ const value = localStorage.getItem(MODEL_KEY); return modelOf(value) ? value : "deepseek"; }catch(error){ return "deepseek"; }
}
let model = readModel();
const settings = {root:document.querySelector("#settings"), gear:document.querySelector("#gear"), panel:document.querySelector("#settings-panel"), cards:document.querySelector("#model-cards")};
const pick = {root:document.querySelector("#model-pick"), chip:document.querySelector("#model-chip"), menu:document.querySelector("#model-menu")};
const pvChip = document.querySelector("#pv-chip");
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

settings.cards.innerHTML = MODELS.map(item => `<button type="button" class="mcard" role="radio" data-id="${item.id}" aria-checked="false" tabindex="-1">${markHtml(item.id,"lg")}<span class="mname">${item.name}${item.id === "deepseek" ? '<span class="pill">默认</span>' : ""}</span><i class="mcheck">${CHECK}</i></button>`).join("");
pick.menu.innerHTML = MODELS.map(item => `<button type="button" role="menuitemradio" data-id="${item.id}" aria-checked="false">${markHtml(item.id,"xs")}<span class="grow">${item.name}</span>${CHECK.replace('<svg ','<svg class="ok" ')}</button>`).join("");

function chipHtml(id){
  const item = modelOf(id);
  return `${markHtml(id,"sm")}<span>${item.short}</span>${CHEVRON}`;
}
function renderModel(animate){
  pick.chip.innerHTML = chipHtml(model);
  pvChip.innerHTML = chipHtml(model);
  [pick.chip, pvChip].forEach(chip => {
    chip.classList.remove("swap");
    if(animate && !reduceMotion()){ void chip.offsetWidth; chip.classList.add("swap"); }
  });
  settings.cards.querySelectorAll(".mcard").forEach(card => {
    const on = card.dataset.id === model;
    card.setAttribute("aria-checked", String(on));
    card.tabIndex = on ? 0 : -1;
  });
  pick.menu.querySelectorAll("button").forEach(item => {
    const on = item.dataset.id === model;
    item.setAttribute("aria-checked", String(on));
    item.querySelector(".ok").style.visibility = on ? "visible" : "hidden";
  });
  document.querySelector("#gear-dot").hidden = model === "deepseek";
}
function setModel(id, animate = true){
  if(!modelOf(id) || id === model) return;
  model = id;
  try{ localStorage.setItem(MODEL_KEY, id); }catch(error){}
  renderModel(animate);
}
window.addEventListener("storage", event => {
  if(event.key !== null && event.key !== MODEL_KEY) return;
  const next = readModel();
  if(next === model) return;
  model = next;
  renderModel(true);
});

function setPanel(open){
  settings.panel.hidden = !open;
  settings.gear.setAttribute("aria-expanded", String(open));
  if(open){ const on = settings.cards.querySelector('[aria-checked="true"]'); if(on) on.focus({preventScroll:true}); }
}
function setPick(open, focusItem){
  pick.menu.hidden = !open;
  pick.chip.setAttribute("aria-expanded", String(open));
  if(open && focusItem){ const on = pick.menu.querySelector('[aria-checked="true"]'); (on || pick.menu.querySelector("button")).focus(); }
}
settings.gear.addEventListener("click", () => { setPick(false); setPanel(settings.panel.hidden); });
settings.cards.addEventListener("click", event => {
  const card = event.target.closest(".mcard");
  if(!card) return;
  const changed = card.dataset.id !== model;
  setModel(card.dataset.id);
  if(changed && !reduceMotion()){
    card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
  }
});
settings.cards.addEventListener("keydown", event => {
  const step = {ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1}[event.key];
  if(!step) return;
  event.preventDefault();
  const cards = [...settings.cards.querySelectorAll(".mcard")];
  const next = cards[(cards.indexOf(document.activeElement) + step + cards.length) % cards.length];
  setModel(next.dataset.id);
  next.focus();
  if(!reduceMotion()){ next.classList.remove("bounce"); void next.offsetWidth; next.classList.add("bounce"); }
});
pick.chip.addEventListener("click", () => { setPanel(false); setPick(pick.menu.hidden, true); });
pick.chip.addEventListener("keydown", event => {
  if(event.key === "ArrowDown" && pick.menu.hidden){ event.preventDefault(); setPanel(false); setPick(true, true); }
});
pick.menu.addEventListener("click", event => {
  const item = event.target.closest("button");
  if(!item) return;
  setModel(item.dataset.id);
  setPick(false);
  pick.chip.focus();
});
pick.menu.addEventListener("keydown", event => {
  const items = [...pick.menu.querySelectorAll("button")];
  const step = {ArrowDown:1, ArrowUp:-1}[event.key];
  if(step){ event.preventDefault(); items[(items.indexOf(document.activeElement) + step + items.length) % items.length].focus(); }
  else if(event.key === "Tab") setPick(false);
});
document.addEventListener("pointerdown", event => {
  if(!settings.panel.hidden && !settings.root.contains(event.target)) setPanel(false);
  if(!pick.menu.hidden && !pick.root.contains(event.target)) setPick(false);
});
document.addEventListener("keydown", event => {
  if(event.key !== "Escape") return;
  if(!settings.panel.hidden){ setPanel(false); settings.gear.focus(); }
  if(!pick.menu.hidden){ setPick(false); pick.chip.focus(); }
});
renderModel(false);

function setTag(thumb, row){
  const old = thumb.querySelector(".mtag");
  const item = modelOf(row.model);
  const key = item ? item.id : "";
  if(old && old.dataset.id === key) return;
  if(old) old.remove();
  if(!item) return;
  const tag = document.createElement("span");
  tag.className = "mtag";
  tag.dataset.id = key;
  tag.title = "研究模型：" + item.name;
  tag.innerHTML = markHtml(key, "xs") + item.short;
  thumb.appendChild(tag);
}

const STATUS = {running:"进行中", finished:"已完成", failed:"未完成"};
const TONE = {origin:"#48d3e4", green:"#58d69a", cyan:"#48d3e4", violet:"#aa8cff", amber:"#f4c56a", blue:"#6d9cff", teal:"#7ddec8", pending:"#9eb0c2"};
const EDGE = {parent:"#6d9cff", audit:"#aa8cff", support:"#58d69a", challenge:"#f4c56a", error:"#ff5d6c", fusion:"#aa8cff"};
const NS = "http://www.w3.org/2000/svg";
const cards = new Map();
const watches = new Map();
const historyTags = new Map();
let historyTimer = 0;
let historyBusy = false;
let historyFailures = 0;
const thumbnailObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const id = entry.target.dataset.id;
    entry.target.dataset.visible = String(entry.isIntersecting);
    const watch = watches.get(id);
    if(!watch) return;
    if(entry.isIntersecting && (watch.live || !watch.loaded)) void loadThumb(id);
    else clearTimeout(watch.timer);
  });
},{rootMargin:"200px"});


function when(value){
  if(!value) return "";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";
  const pad = number => String(number).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function viewUrl(row){
  return "/api/studies/" + String(row.href || "").replace(/^\/study\//, "") + "/snapshot";
}

function paint(svg, view){
  const nodes = (view && view.ok && view.nodes) || [];
  svg.replaceChildren();
  if(!nodes.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(node => {
    const radius = node.radius || 48;
    minX = Math.min(minX, node.x - radius);
    minY = Math.min(minY, node.y - radius);
    maxX = Math.max(maxX, node.x + radius);
    maxY = Math.max(maxY, node.y + radius);
  });
  const pad = 36;
  svg.setAttribute("viewBox", `${minX - pad} ${minY - pad} ${Math.max(1, maxX - minX) + pad * 2} ${Math.max(1, maxY - minY) + pad * 2}`);
  const weight = Math.max(maxX - minX, maxY - minY, 1) / 150;
  const byId = new Map(nodes.map(node => [node.id, node]));
  (view.edges || []).forEach(edge => {
    const from = byId.get(edge.from), to = byId.get(edge.to);
    if(!from || !to) return;
    const relation = edge.relation === "fusion" ? "audit" : edge.relation;
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", from.x);
    line.setAttribute("y1", from.y);
    line.setAttribute("x2", to.x);
    line.setAttribute("y2", to.y);
    line.setAttribute("stroke", EDGE[relation] || "#6d9cff");
    line.setAttribute("stroke-width", String(weight));
    line.setAttribute("stroke-linecap", "round");
    if(relation !== "parent" && relation !== "support") line.setAttribute("stroke-dasharray", `${weight * 1.4} ${weight * 2}`);
    svg.appendChild(line);
  });
  nodes.forEach(node => {
    const circle = document.createElementNS(NS, "circle");
    circle.dataset.id = node.id;
    circle.setAttribute("cx", node.x);
    circle.setAttribute("cy", node.y);
    circle.setAttribute("r", node.radius || 48);
    circle.setAttribute("fill", TONE[node.tone] || "#6d9cff");
    svg.appendChild(circle);
  });
}

function signature(view){
  if(!view || !view.ok) return "empty";
  const nodes = (view.nodes || []).map(node => `${node.id}:${Math.round(node.x)}:${Math.round(node.y)}:${Math.round(node.radius || 0)}:${node.tone}`).join(",");
  const edges = (view.edges || []).map(edge => `${edge.from}${edge.relation}${edge.to}`).join(",");
  return nodes + "|" + edges;
}

async function loadThumb(id){
  const card = cards.get(id);
  const watch = watches.get(id);
  if(!card || !watch || watch.busy || document.hidden || card.dataset.visible !== "true") return;
  clearTimeout(watch.timer);
  watch.busy = true;
  try {
    const response = await fetch(watch.thumbUrl,{cache:"no-store",signal:AbortSignal.timeout(15000),headers:watch.etag ? {"If-None-Match":watch.etag} : {}});
    if(response.status === 304) return;
    if(!response.ok) throw new Error("thumbnail unavailable");
    const view = await response.json();
    if(watches.get(id) !== watch) return;
    watch.etag = response.headers.get("ETag") || "";
    const next = signature(view);
    watch.loaded = true;
    if(view.running === false) watch.live = false;
    if(next === watch.sig) return;
    watch.sig = next;
    paint(card.querySelector("svg"), view);
  } catch (error) {
    watch.sig = "error";
  } finally {
    watch.busy = false;
    if(watches.get(id) === watch && watch.live && !document.hidden && card.dataset.visible === "true"){
      watch.timer = setTimeout(() => loadThumb(id),2000);
    }
  }
}

function watchThumb(row){
  const live = row.status === "running";
  const previous = watches.get(row.id);
  if(previous && previous.live === live) return;
  if(previous) clearTimeout(previous.timer);
  const url = viewUrl(row);
  const state = {url,thumbUrl:url.replace(/\/snapshot$/,"/thumbnail"),live,sig:previous?.sig || "",timer:0,view:previous?.view || null};
  watches.set(row.id,state);
  void loadThumb(row.id);
}

async function prefetchStudy(id){
  const watch = watches.get(id);
  if(!watch || watch.prefetching || document.hidden || (watch.view && Date.now() - watch.view.at < 10000)) return;
  watch.prefetching = true;
  try{
    const response = await fetch(watch.url,{signal:AbortSignal.timeout(15000)});
    if(!response.ok) return;
    const payload = await response.json();
    if(watches.get(id) === watch) watch.view = {payload,at:Date.now()};
  }catch(error){ /* A click can still load the destination normally. */ }
  finally{watch.prefetching = false;}
}

function caption(row){
  const bits = [STATUS[row.status] || row.status];
  if(!row.constellation && row.status !== "running") bits.push("没有星图");
  const time = when(row.created_at);
  if(time) bits.push(time);
  return bits.join(" · ");
}

function buildCard(row){
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = row.id;
  thumbnailObserver.observe(card);
  const link = document.createElement("a");
  link.className = "card-link";
  link.href = row.href;
  link.dataset.id = row.id;
  link.addEventListener("pointerenter", () => prefetchStudy(row.id));
  link.addEventListener("focusin", () => prefetchStudy(row.id));
  const frame = document.createElement("div");
  frame.className = row.status === "running" ? "thumb-frame live" : "thumb-frame";
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("aria-hidden", "true");
  thumb.appendChild(svg);
  if(row.status === "running"){
    const dot = document.createElement("i");
    dot.className = "live-dot";
    thumb.appendChild(dot);
  }
  setTag(thumb, row);
  const meta = document.createElement("small");
  meta.textContent = caption(row);
  const title = document.createElement("b");
  title.textContent = row.title;
  const overlay = document.createElement("div");
  overlay.className = "caption";
  overlay.append(meta, title);
  thumb.appendChild(overlay);
  const forget = document.createElement("button");
  forget.type = "button";
  forget.className = "forget";
  forget.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 4.2h9.6M6.2 4.1V3.1a.8.8 0 0 1 .8-.8h2a.8.8 0 0 1 .8.8v1M4.4 4.2l.6 8.2a.8.8 0 0 0 .8.7h4.4a.8.8 0 0 0 .8-.7l.6-8.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 6.4v4.2M9.4 6.4v4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  forget.setAttribute("aria-label", "删除这项研究");
  forget.addEventListener("click", async event => {
    event.preventDefault();
    event.stopPropagation();
    if(forget.disabled) return;
    const deleted = await askForget(row, forget);
    if(!deleted) return;
    const watch = watches.get(row.id);
    if(watch) clearTimeout(watch.timer);
    watches.delete(row.id);
    cards.delete(row.id);
    card.remove();
    refresh();
  });
  frame.append(thumb);
  link.append(frame);
  card.append(link, forget);
  return card;
}

function place(host, rows){
  const group = host.parentElement;
  if(!rows.length){
    if(host.querySelector(".empty-note")) return;
    host.replaceChildren();
    group.classList.add("is-empty");
    const note = document.createElement("p");
    note.className = "empty-note";
    note.textContent = host.id === "running" ? "没有正在进行的研究。" : "还没有完成的研究。";
    host.appendChild(note);
    return;
  }
  group.classList.remove("is-empty");
  host.querySelectorAll(".empty-note").forEach(el => el.remove());
  rows.forEach((row,index) => {
    let card = cards.get(row.id);
    if(!card){
      card = buildCard(row);
      cards.set(row.id, card);
      watchThumb(row);
    } else {
      card.querySelector("b").textContent = row.title;
      card.querySelector("small").textContent = caption(row);
      setTag(card.querySelector(".thumb"), row);
      card.querySelector(".thumb-frame").classList.toggle("live", row.status === "running");
      const dot = card.querySelector(".live-dot");
      if(row.status === "running" && !dot){
        const mark = document.createElement("i");
        mark.className = "live-dot";
        card.querySelector(".thumb").appendChild(mark);
      } else if(row.status !== "running" && dot){
        dot.remove();
      }
      watchThumb(row);
    }
    if(host.children[index] !== card) host.insertBefore(card,host.children[index] || null);
  });
}

function renderHistory(rows){
  const alive = new Set(rows.map(row => row.id));
  for(const id of [...cards.keys()]){
    if(alive.has(id)) continue;
    const watch = watches.get(id);
    if(watch) clearTimeout(watch.timer);
    watches.delete(id);
    const card = cards.get(id);
    if(card){thumbnailObserver.unobserve(card);card.remove();}
    cards.delete(id);
  }
  place(document.querySelector("#running"), rows.filter(row => row.status === "running"));
  place(document.querySelector("#done"), rows.filter(row => row.status !== "running"));
}

async function refresh(){
  if(historyBusy || document.hidden) return;
  clearTimeout(historyTimer);
  historyBusy = true;
  try {
    const url = "/api/history?compact=1";
    const tag = historyTags.get(url);
    const response = await fetch(url,{cache:"no-store",signal:AbortSignal.timeout(15000),headers:tag ? {"If-None-Match":tag} : {}});
    if(response.status !== 304){
      if(!response.ok) throw new Error("history unavailable");
      const rows = await response.json();
      const etag = response.headers.get("ETag");
      if(etag) historyTags.set(url,etag);
      renderHistory(rows);
    }
    historyFailures = 0;
  } catch (error) {
    historyFailures = Math.min(4,historyFailures + 1);
    if(!cards.size){
      const host = document.querySelector("#done");
      host.replaceChildren();
      const note = document.createElement("p");
      note.className = "empty-note";
      note.textContent = "历史暂未读出，正在重试。";
      host.appendChild(note);
    }
  } finally {
    historyBusy = false;
    if(!document.hidden) historyTimer = setTimeout(refresh,Math.min(30000,3000 * 2 ** historyFailures));
  }
}

document.querySelector("#question").addEventListener("keydown", event => {
  if(event.key !== "Enter" || event.shiftKey || event.isComposing || event.keyCode === 229) return;
  event.preventDefault();
  if(event.repeat) return;
  const form = event.currentTarget.form;
  const button = form.querySelector(".launch");
  if(!button.disabled) form.requestSubmit(button);
});

document.querySelector("#ask").addEventListener("submit", async event => {
  event.preventDefault();
  const question = document.querySelector("#question").value.trim();
  const button = event.currentTarget.querySelector(".launch");
  if(button.disabled) return;
  const error = document.querySelector("#ask-error");
  error.hidden = true;
  button.disabled = true;
  try {
    const response = await fetch("/api/questions", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, model}),
    });
    const payload = await response.json();
    if(!response.ok){
      error.hidden = false;
      error.textContent = payload.error || "没有提交成功。";
      button.disabled = false;
      return;
    }
    if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      await playLaunch();
    }
    location.href = payload.href;
  } catch (err) {
    error.hidden = false;
    error.textContent = "没有提交成功。刷新后再试一次。";
    button.disabled = false;
  }
});

function playLaunch(){
  const composer = document.querySelector(".composer");
  const button = composer.querySelector(".launch");
  const bounds = composer.getBoundingClientRect();
  const target = button.getBoundingClientRect();
  const endX = target.left + target.width / 2 - bounds.left;
  const endY = target.top + target.height / 2 - bounds.top;
  const starts = [
    [0.04,0.06,"#5ce1ff"],[0.34,0.02,"#6d9cff"],[0.72,0.02,"#c084fc"],
    [0.96,0.2,"#ff6eb4"],[0.03,0.74,"#ffd36a"],[0.43,0.98,"#7dffb3"],
  ];
  composer.classList.add("launching");
  starts.forEach(([x,y,color],index) => {
    const spark = document.createElement("i");
    spark.className = "launch-spark";
    spark.style.left = `${bounds.width * x}px`;
    spark.style.top = `${bounds.height * y}px`;
    spark.style.color = color;
    spark.style.setProperty("--spark-color", color);
    spark.style.setProperty("--dx", `${endX - bounds.width * x}px`);
    spark.style.setProperty("--dy", `${endY - bounds.height * y}px`);
    spark.style.animationDelay = `${index * 12}ms`;
    composer.appendChild(spark);
  });
  return new Promise(resolve => setTimeout(resolve, 540));
}

let forgetAsk = null;
function askForget(row, opener){
  if(forgetAsk) return Promise.resolve(false);
  const veil = document.querySelector("#forget-veil");
  const stay = document.querySelector("#forget-stay");
  const yes = document.querySelector("#forget-yes");
  const error = document.querySelector("#forget-error");
  document.querySelector("#forget-which").textContent = row.title || "这项研究";
  document.querySelector("#forget-note").textContent = row.status === "running"
    ? "研究仍在进行。删除会停止任务，并移除星图、报告和运行记录。此操作无法撤销。"
    : "星图、报告和运行记录会一起移除。此操作无法撤销。";
  error.hidden = true;
  error.textContent = "";
  yes.disabled = false;
  yes.removeAttribute("aria-disabled");
  stay.disabled = false;
  yes.textContent = "永久删除";
  veil.hidden = false;
  document.body.classList.add("confirm-open");
  stay.focus();
  return new Promise(resolve => {
    let busy = false;
    function finish(ok){
      if(!forgetAsk) return;
      forgetAsk = null;
      veil.hidden = true;
      document.body.classList.remove("confirm-open");
      document.removeEventListener("keydown", onKey);
      stay.onclick = yes.onclick = veil.onclick = null;
      if(opener && opener.isConnected) opener.focus();
      resolve(ok);
    }
    function onKey(event){
      if(event.key === "Escape"){
        event.preventDefault();
        if(!busy) finish(false);
        return;
      }
      if(event.key !== "Tab") return;
      if(busy){
        event.preventDefault();
        yes.focus();
        return;
      }
      const nodes = [stay, yes];
      const index = nodes.indexOf(document.activeElement);
      event.preventDefault();
      nodes[(index + (event.shiftKey ? -1 : 1) + 2) % 2].focus();
    }
    forgetAsk = finish;
    document.addEventListener("keydown", onKey);
    stay.onclick = () => finish(false);
    yes.onclick = async () => {
      if(busy) return;
      busy = true;
      yes.setAttribute("aria-disabled", "true");
      stay.disabled = true;
      yes.textContent = "正在删除…";
      error.hidden = true;
      try {
        const response = await fetch("/api/studies/" + encodeURI(row.id), {method: "DELETE"});
        if(!response.ok){
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || "删除失败，请重试。");
        }
        finish(true);
      } catch (reason) {
        error.textContent = reason instanceof Error && reason.message !== "Failed to fetch"
          ? reason.message : "连接失败，研究尚未删除。请重试。";
        error.hidden = false;
        busy = false;
        yes.removeAttribute("aria-disabled");
        stay.disabled = false;
        yes.textContent = "永久删除";
        stay.focus();
      }
    };
    veil.onclick = event => { if(event.target === veil && !busy) finish(false); };
  });
}

refresh();
document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    clearTimeout(historyTimer);
    watches.forEach(watch => clearTimeout(watch.timer));
  }else{
    void refresh();
    watches.forEach((watch,id) => {if(watch.live || !watch.loaded) void loadThumb(id);});
  }
});

let zooming = false;
let zoomCleanup = null;

function sharedNodeTransform(source, target, worldScale){
  const dx = (source.left + source.width / 2 - target.left - target.width / 2) / worldScale;
  const dy = (source.top + source.height / 2 - target.top - target.height / 2) / worldScale;
  return `translate(${dx}px, ${dy}px) scale(${source.width / target.width})`;
}
function sharedEdgeTransform(matrix, camera){
  return `translate(${(matrix.e - camera.left - camera.panX) / camera.scale}px, ${(matrix.f - camera.top - camera.panY) / camera.scale}px) scale(${matrix.a / camera.scale})`;
}
function resetThumbFlight(){
  if(zoomCleanup) zoomCleanup();
  zoomCleanup = null;
  zooming = false;
  document.body.classList.remove("is-zooming");
}
window.addEventListener("pageshow", event => {
  if(event.persisted) resetThumbFlight();
});
document.addEventListener("click", async event => {
  if(event.target.closest(".forget")) return;
  const link = event.target.closest("a.card-link");
  if(!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const thumb = link.querySelector(".thumb");
  const svg = thumb?.querySelector("svg");
  if(!thumb || !svg) return;
  event.preventDefault();
  if(zooming) return;
  zooming = true;

  // Read the source before locking scroll can change the homepage's width.
  const rect = thumb.getBoundingClientRect();
  const svgRect = svg.getBoundingClientRect();
  const matrix = svg.getScreenCTM();
  const sources = new Map([...svg.querySelectorAll("circle[data-id]")].map(node => [node.dataset.id, node.getBoundingClientRect()]));
  const destination = new URL(link.href);
  const watch = [...watches.values()].find(item => item.url === "/api/studies/" + destination.pathname.replace(/^\/study\//, "") + "/snapshot");
  const cached = watch?.view;
  document.body.classList.add("is-zooming");

  const shade = document.createElement("div");
  shade.className = "zoom-shade";
  const ghost = document.createElement("div");
  ghost.className = "zoom-ghost";
  ghost.setAttribute("aria-hidden", "true");
  Object.assign(ghost.style, {left:`${rect.left}px`, top:`${rect.top}px`, width:`${rect.width}px`, height:`${rect.height}px`});
  const copy = svg.cloneNode(true);
  copy.style.height = `${svgRect.height}px`;
  const frost = document.createElement("div");
  frost.className = "zoom-frost";
  ghost.append(copy, frost);

  const scene = document.createElement("iframe");
  scene.className = "study-scene";
  scene.title = "研究星图预览";
  scene.tabIndex = -1;
  scene.setAttribute("aria-hidden", "true");
  const preview = new URL(destination.href);
  preview.searchParams.set("entry-preview", "1");
  let done = false;
  let transferred = null;
  let watchdog;
  const animations = [];
  let cancelled;
  const cancellation = new Promise(resolve => { cancelled = resolve; });
  const loaded = new Promise((resolve, reject) => {
    scene.addEventListener("load", resolve, {once:true});
    scene.addEventListener("error", () => reject(new Error("preview failed")), {once:true});
  });
  const onResize = () => {
    animations.forEach(animation => animation.cancel());
    go();
  };
  zoomCleanup = () => {
    done = true;
    cancelled();
    clearTimeout(watchdog);
    window.removeEventListener("resize", onResize);
    animations.forEach(animation => animation.cancel());
    scene.remove();
    ghost.remove();
    shade.remove();
    thumb.style.visibility = "";
    try{ sessionStorage.removeItem("piresearch-zoom"); }catch(err){}
  };
  const go = () => {
    if(done) return;
    done = true;
    clearTimeout(watchdog);
    window.removeEventListener("resize", onResize);
    try{
      sessionStorage.setItem("piresearch-zoom", JSON.stringify({
        href:destination.pathname, at:Date.now(),
        view:transferred ? {payload:transferred.payload, at:Date.now()} : cached || null,
        camera:transferred?.camera || null,
      }));
    }catch(err){}
    location.assign(destination.href);
  };
  window.addEventListener("resize", onResize);
  watchdog = setTimeout(go, 2500);
  scene.src = preview.href;
  document.body.append(shade, ghost, scene);

  const animate = (node, frames, timing) => {
    const animation = node.animate(frames, {...timing,fill:"both"});
    animations.push(animation);
    return animation.finished;
  };
  try{
    await Promise.race([loaded,cancellation]);
    if(done) return;
    const bridge = scene.contentWindow?.studyEntry;
    if(!bridge) throw new Error("preview bridge unavailable");
    transferred = await Promise.race([bridge.prepare(cached),cancellation]);
    if(done) return;
    if(!transferred?.payload?.ok) throw new Error("preview graph unavailable");
    const targetDocument = scene.contentDocument;
    const timing = {duration:520,easing:"cubic-bezier(.22,1,.36,1)"};
    const jobs = [];
    // Animate the real target nodes inside their real page, never enlarged dots.
    for(const node of targetDocument.querySelectorAll(".node")){
      const target = node.getBoundingClientRect();
      const source = sources.get(node.dataset.id);
      if(source && target.width > 0){
        node.style.transformOrigin = "center center";
        jobs.push(animate(node, [{transform:sharedNodeTransform(source,target,transferred.camera.scale)}, {transform:"translate(0px, 0px) scale(1)"}], timing));
      } else {
        jobs.push(animate(node, [{opacity:0},{opacity:1}], {...timing,duration:240,delay:180}));
      }
      for(const label of node.querySelectorAll(".node-content,.node-tab,.node-id")){
        jobs.push(animate(label,[{opacity:0},{opacity:1}],{...timing,duration:220,delay:220}));
      }
    }
    const edges = targetDocument.querySelector("svg.edges");
    if(edges && matrix){
      edges.style.transformOrigin = "0 0";
      jobs.push(animate(edges,[{transform:sharedEdgeTransform(matrix,transferred.camera)},{transform:"translate(0px, 0px) scale(1)"}],timing));
    }
    for(const chrome of targetDocument.querySelectorAll(".top,.legend,.zoom")){
      jobs.push(animate(chrome,[{opacity:0},{opacity:1}],{...timing,duration:220,delay:250}));
    }
    thumb.style.visibility = "hidden";
    // Only this initial reveal changes scene opacity. The source glass is
    // unchanged beneath it, and the final graph is already the target page.
    jobs.push(animate(scene,[{opacity:0},{opacity:1}],{duration:100,easing:"linear"}));
    await Promise.race([Promise.all(jobs),cancellation]);
    if(done) return;
    // Hold the identical final frame for a paint before address navigation.
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  }catch(err){ /* Preview failure falls back to ordinary same-origin navigation. */ }
  go();
});
</script>
